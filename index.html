<!doctype html>
<html lang="ru" class="scroll-smooth">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ThaiFast — тайский с нуля</title>
<meta name="description" content="Тайский язык с нуля: звуки, тоны, алфавит, цифры, нужные фразы и быстрые тренажёры.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: { extend: {
    fontFamily: { sans: ['Inter', 'Noto Sans Thai', 'system-ui', 'sans-serif'], thai: ['Noto Sans Thai', 'sans-serif'] },
    colors: { ink: { 950: '#09090b', 900: '#101114', 800: '#17191d', 700: '#23262c', 600: '#33373f' }, accent: '#e8b04b' }
  } }
}
</script>
<script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
<style>
  body { background: #09090b; }
  .flip { perspective: 1200px; }
  .flip-inner { transition: transform .6s cubic-bezier(.2,.8,.2,1); transform-style: preserve-3d; }
  .flip.flipped .flip-inner { transform: rotateY(180deg); }
  .face { backface-visibility: hidden; -webkit-backface-visibility: hidden; }
  .face.back { transform: rotateY(180deg); }
  .reveal { opacity: 0; transform: translateY(24px); transition: opacity .7s, transform .7s cubic-bezier(.2,.8,.2,1); }
  .reveal.in { opacity: 1; transform: none; }
  .tone-path { stroke-dasharray: 100; stroke-dashoffset: 100; transition: stroke-dashoffset .9s cubic-bezier(.2,.8,.2,1); }
  .reveal.in .tone-path, .tone-btn .tone-path { stroke-dashoffset: 0; }
  @keyframes shake { 20%,60% { transform: translateX(-6px) } 40%,80% { transform: translateX(6px) } }
  .shake { animation: shake .4s; }
  @keyframes pop { 50% { transform: scale(1.04) } }
  .pop { animation: pop .35s; }
  @keyframes pulseRing { 0% { box-shadow: 0 0 0 0 rgba(232,176,75,.55) } 100% { box-shadow: 0 0 0 14px rgba(232,176,75,0) } }
  .speaking { animation: pulseRing 1s infinite; color: #e8b04b; border-color: #e8b04b; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(8px) } to { opacity: 1; transform: none } }
  .fade-up { animation: fadeUp .45s cubic-bezier(.2,.8,.2,1); }
  .grid-bg { background-image: linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px); background-size: 48px 48px; }
  input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; }
  input[type=number] { -moz-appearance: textfield; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } .reveal { opacity: 1; transform: none; } }
</style>
</head>
<body class="text-zinc-200 font-sans antialiased selection:bg-accent selection:text-ink-950">

<!-- NAV -->
<header class="fixed top-0 inset-x-0 z-40 border-b border-white/5 bg-ink-950/75 backdrop-blur-xl">
  <nav class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between gap-3">
    <a href="#top" class="flex items-center gap-2 font-bold tracking-tight text-white">
      <span class="grid place-items-center w-8 h-8 rounded-lg bg-accent text-ink-950"><i data-lucide="zap" class="w-4 h-4"></i></span>
      ThaiFast
    </a>
    <div class="hidden lg:flex items-center gap-6 text-sm text-zinc-400">
      <a href="#sounds" class="hover:text-white transition" data-i18n="navSounds"></a>
      <a href="#tones" class="hover:text-white transition" data-i18n="navTones"></a>
      <a href="#alphabet" class="hover:text-white transition" data-i18n="navAlpha"></a>
      <a href="#phrases" class="hover:text-white transition" data-i18n="navPhrases"></a>
      <a href="#words" class="hover:text-white transition" data-i18n="navWords"></a>
      <a href="#train" class="hover:text-white transition" data-i18n="navTrain"></a>
    </div>
    <div class="flex items-center gap-2">
      <div class="flex rounded-lg border border-white/10 p-0.5 text-xs font-semibold" role="group" aria-label="Gender">
        <button data-gender="m" class="px-2.5 py-1.5 rounded-md transition flex items-center gap-1"><i data-lucide="user" class="w-3.5 h-3.5"></i><span data-i18n="male"></span></button>
        <button data-gender="f" class="px-2.5 py-1.5 rounded-md transition flex items-center gap-1"><i data-lucide="user-round" class="w-3.5 h-3.5"></i><span data-i18n="female"></span></button>
      </div>
      <div class="flex rounded-lg border border-white/10 p-0.5 text-xs font-semibold" role="group" aria-label="Language">
        <button data-lang="ru" class="px-2.5 py-1.5 rounded-md transition">RU</button>
        <button data-lang="en" class="px-2.5 py-1.5 rounded-md transition">EN</button>
      </div>
    </div>
  </nav>
</header>

<main id="top">
  <!-- HERO -->
  <section class="relative overflow-hidden pt-32 pb-20 md:pt-40 md:pb-28 grid-bg">
    <div class="absolute -top-40 left-1/2 -translate-x-1/2 w-[900px] h-[600px] rounded-full bg-accent/10 blur-3xl pointer-events-none"></div>
    <div class="relative max-w-6xl mx-auto px-4 grid md:grid-cols-2 gap-12 items-center">
      <div class="reveal">
        <div class="inline-flex items-center gap-2 rounded-full border border-white/10 bg-white/5 px-3 py-1 text-xs text-zinc-400">
          <i data-lucide="timer" class="w-3.5 h-3.5 text-accent"></i><span data-i18n="badge"></span>
        </div>
        <h1 class="mt-6 text-4xl md:text-6xl font-extrabold tracking-tight text-white leading-[1.05]" data-i18n="heroTitle"></h1>
        <p class="mt-5 text-lg text-zinc-400 max-w-md" data-i18n="heroSub"></p>
        <div class="mt-8 flex flex-wrap gap-3">
          <a href="#sounds" class="inline-flex items-center gap-2 rounded-xl bg-accent px-5 py-3 font-semibold text-ink-950 hover:brightness-110 transition">
            <span data-i18n="ctaStart"></span><i data-lucide="arrow-right" class="w-4 h-4"></i>
          </a>
          <a href="#train" class="inline-flex items-center gap-2 rounded-xl border border-white/10 px-5 py-3 font-semibold text-white hover:bg-white/5 transition">
            <i data-lucide="dumbbell" class="w-4 h-4"></i><span data-i18n="ctaTrain"></span>
          </a>
        </div>
        <dl class="mt-10 grid grid-cols-3 gap-4 max-w-sm text-sm">
          <div><dt class="text-2xl font-bold text-white">44</dt><dd class="text-zinc-500" data-i18n="statLetters"></dd></div>
          <div><dt class="text-2xl font-bold text-white" id="statPhrases"></dt><dd class="text-zinc-500" data-i18n="statPhrases"></dd></div>
          <div><dt class="text-2xl font-bold text-white" id="statWords"></dt><dd class="text-zinc-500" data-i18n="statWords"></dd></div>
        </dl>
      </div>

      <div class="reveal">
        <div class="relative rounded-3xl border border-white/10 bg-ink-900/80 p-8 shadow-2xl shadow-black/50">
          <div class="flex items-center justify-between text-xs text-zinc-500">
            <span class="flex items-center gap-2"><span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span><span data-i18n="heroCard"></span></span>
            <span id="heroIdx" class="font-mono"></span>
          </div>
          <div id="heroWord" class="mt-8 min-h-[190px]"></div>
          <div class="mt-6 flex items-center gap-3">
            <button id="heroPlay" class="grid place-items-center w-12 h-12 rounded-full border border-white/15 hover:border-accent hover:text-accent transition" aria-label="Play"><i data-lucide="volume-2" class="w-5 h-5"></i></button>
            <button id="heroNext" class="grid place-items-center w-12 h-12 rounded-full border border-white/15 hover:bg-white/5 transition" aria-label="Next"><i data-lucide="chevron-right" class="w-5 h-5"></i></button>
            <div class="flex-1 h-1 rounded-full bg-white/5 overflow-hidden"><div id="heroBar" class="h-full bg-accent w-0"></div></div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- 01 SOUNDS -->
  <section id="sounds" class="py-20 md:py-28 border-t border-white/5">
    <div class="max-w-6xl mx-auto px-4">
      <div class="reveal max-w-2xl">
        <p class="font-mono text-sm text-accent">01</p>
        <h2 class="mt-2 text-3xl md:text-4xl font-bold text-white tracking-tight" data-i18n="soundsTitle"></h2>
        <p class="mt-3 text-zinc-400" data-i18n="soundsSub"></p>
      </div>
      <div id="soundsGrid" class="mt-10 grid sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>
      <div class="reveal mt-6 flex items-start gap-3 rounded-2xl border border-accent/20 bg-accent/5 p-5 text-sm">
        <i data-lucide="ruler" class="w-5 h-5 text-accent shrink-0 mt-0.5"></i>
        <p class="text-zinc-300" data-i18n="lengthNote"></p>
      </div>
    </div>
  </section>

  <!-- 02 TONES -->
  <section id="tones" class="py-20 md:py-28 border-t border-white/5 bg-ink-900/40">
    <div class="max-w-6xl mx-auto px-4">
      <div class="reveal max-w-2xl">
        <p class="font-mono text-sm text-accent">02</p>
        <h2 class="mt-2 text-3xl md:text-4xl font-bold text-white tracking-tight" data-i18n="tonesTitle"></h2>
        <p class="mt-3 text-zinc-400" data-i18n="tonesSub"></p>
      </div>
      <div id="tonesGrid" class="reveal mt-10 grid grid-cols-2 md:grid-cols-5 gap-3"></div>
      <div class="reveal mt-6 rounded-2xl border border-white/10 bg-ink-950 p-6 flex flex-col md:flex-row md:items-center gap-4 justify-between">
        <div>
          <p class="text-xs uppercase tracking-widest text-zinc-500" data-i18n="twister"></p>
          <p class="mt-2 font-thai text-3xl text-white">ไม้ใหม่ไม่ไหม้ไหม</p>
          <p class="mt-1 font-mono text-accent">mái mài mâi mâi mǎi</p>
          <p class="mt-1 text-sm text-zinc-400" data-i18n="twisterTr"></p>
        </div>
        <button data-say="ไม้ใหม่ไม่ไหม้ไหม" class="self-start md:self-auto inline-flex items-center gap-2 rounded-xl border border-white/15 px-4 py-2.5 text-sm font-semibold hover:border-accent hover:text-accent transition">
          <i data-lucide="volume-2" class="w-4 h-4"></i><span data-i18n="listen"></span>
        </button>
      </div>
    </div>
  </section>

  <!-- 03 ALPHABET -->
  <section id="alphabet" class="py-20 md:py-28 border-t border-white/5">
    <div class="max-w-6xl mx-auto px-4">
      <div class="reveal flex flex-col md:flex-row md:items-end justify-between gap-6">
        <div class="max-w-2xl">
          <p class="font-mono text-sm text-accent">03</p>
          <h2 class="mt-2 text-3xl md:text-4xl font-bold text-white tracking-tight" data-i18n="alphaTitle"></h2>
          <p class="mt-3 text-zinc-400" data-i18n="alphaSub"></p>
        </div>
        <div id="classTabs" class="flex flex-wrap gap-2"></div>
      </div>
      <div class="reveal mt-10 grid lg:grid-cols-[1fr_340px] gap-6 items-start">
        <div id="consGrid" class="grid grid-cols-5 sm:grid-cols-8 lg:grid-cols-9 gap-2"></div>
        <aside id="consDetail" class="lg:sticky lg:top-24 rounded-2xl border border-white/10 bg-ink-900 p-6"></aside>
      </div>

      <div class="reveal mt-14">
        <h3 class="text-xl font-bold text-white" data-i18n="vowelsTitle"></h3>
        <p class="mt-2 text-sm text-zinc-400 max-w-2xl" data-i18n="vowelsSub"></p>
        <div id="vowelGrid" class="mt-6 grid grid-cols-3 sm:grid-cols-5 lg:grid-cols-8 gap-2"></div>
      </div>
    </div>
  </section>

  <!-- 04 PHRASES -->
  <section id="phrases" class="py-20 md:py-28 border-t border-white/5 bg-ink-900/40">
    <div class="max-w-6xl mx-auto px-4">
      <div class="reveal max-w-2xl">
        <p class="font-mono text-sm text-accent">04</p>
        <h2 class="mt-2 text-3xl md:text-4xl font-bold text-white tracking-tight" data-i18n="phrasesTitle"></h2>
        <p class="mt-3 text-zinc-400" data-i18n="phrasesSub"></p>
      </div>
      <div id="catTabs" class="reveal mt-8 flex flex-wrap gap-2"></div>
      <div id="phraseGrid" class="mt-8 grid sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>

      <!-- Bill -->
      <div class="reveal mt-14 rounded-3xl border border-accent/25 bg-ink-950 p-6 md:p-8">
        <div class="flex items-center gap-3">
          <span class="grid place-items-center w-10 h-10 rounded-xl bg-accent/15 text-accent"><i data-lucide="receipt" class="w-5 h-5"></i></span>
          <div>
            <h3 class="text-xl font-bold text-white" data-i18n="billTitle"></h3>
            <p class="text-sm text-zinc-400" data-i18n="billSub"></p>
          </div>
        </div>
        <div class="mt-6 grid md:grid-cols-[260px_1fr] gap-6">
          <div id="billOpts" class="grid grid-cols-2 md:grid-cols-1 gap-2"></div>
          <div id="billOut" class="rounded-2xl border border-white/10 bg-ink-900 p-6 min-h-[220px] flex flex-col justify-center"></div>
        </div>
      </div>
    </div>
  </section>

  <!-- 05 WORDS -->
  <section id="words" class="py-20 md:py-28 border-t border-white/5">
    <div class="max-w-6xl mx-auto px-4">
      <div class="reveal flex flex-col md:flex-row md:items-end justify-between gap-6">
        <div class="max-w-2xl">
          <p class="font-mono text-sm text-accent">05</p>
          <h2 class="mt-2 text-3xl md:text-4xl font-bold text-white tracking-tight" data-i18n="wordsTitle"></h2>
          <p class="mt-3 text-zinc-400" data-i18n="wordsSub"></p>
        </div>
        <div class="inline-flex self-start md:self-auto rounded-2xl border border-white/10 bg-ink-900 p-1 text-sm font-semibold">
          <button data-vtab="num" class="vtab px-4 py-2 rounded-xl flex items-center gap-2 transition"><i data-lucide="hash" class="w-4 h-4"></i><span data-i18n="vNum"></span></button>
          <button data-vtab="body" class="vtab px-4 py-2 rounded-xl flex items-center gap-2 transition"><i data-lucide="person-standing" class="w-4 h-4"></i><span data-i18n="vBody"></span></button>
          <button data-vtab="verb" class="vtab px-4 py-2 rounded-xl flex items-center gap-2 transition"><i data-lucide="move-right" class="w-4 h-4"></i><span data-i18n="vVerb"></span></button>
        </div>
      </div>

      <!-- Numbers -->
      <div data-vpanel="num" class="mt-10">
        <div class="rounded-3xl border border-white/10 bg-ink-900 p-6 md:p-8 grid md:grid-cols-[280px_1fr] gap-8 items-center">
          <div>
            <p class="text-sm font-semibold text-white flex items-center gap-2"><i data-lucide="calculator" class="w-4 h-4 text-accent"></i><span data-i18n="numBuilder"></span></p>
            <div class="mt-4 flex items-center gap-2">
              <button id="numMinus" class="grid place-items-center w-11 h-11 rounded-xl border border-white/10 hover:bg-white/5 transition" aria-label="-"><i data-lucide="minus" class="w-4 h-4"></i></button>
              <input id="numIn" type="number" min="0" max="99999" value="250" class="w-full h-11 rounded-xl border border-white/10 bg-ink-950 px-3 text-center font-mono text-lg text-white focus:outline-none focus:border-accent">
              <button id="numPlus" class="grid place-items-center w-11 h-11 rounded-xl border border-white/10 hover:bg-white/5 transition" aria-label="+"><i data-lucide="plus" class="w-4 h-4"></i></button>
            </div>
            <button id="numRand" class="mt-3 w-full rounded-xl border border-white/10 py-2.5 text-sm font-semibold hover:border-accent hover:text-accent transition flex items-center justify-center gap-2"><i data-lucide="shuffle" class="w-4 h-4"></i><span data-i18n="numRandom"></span></button>
          </div>
          <div id="numOut"></div>
        </div>
        <div id="numGrid" class="mt-6 grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-8 gap-3"></div>
        <p class="mt-6 flex items-start gap-3 text-sm text-zinc-400"><i data-lucide="info" class="w-4 h-4 text-accent shrink-0 mt-0.5"></i><span data-i18n="numNote"></span></p>
      </div>

      <!-- Body -->
      <div data-vpanel="body" class="hidden mt-10">
        <div class="flex items-start gap-3 rounded-2xl border border-accent/20 bg-accent/5 p-5 text-sm">
          <i data-lucide="stethoscope" class="w-5 h-5 text-accent shrink-0 mt-0.5"></i>
          <p class="text-zinc-300" data-i18n="bodyNote"></p>
        </div>
        <div id="bodyGrid" class="mt-6 grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-3"></div>
      </div>

      <!-- Verbs -->
      <div data-vpanel="verb" class="hidden mt-10">
        <div class="rounded-3xl border border-white/10 bg-ink-900 p-6 md:p-8">
          <p class="text-sm font-semibold text-white flex items-center gap-2"><i data-lucide="blocks" class="w-4 h-4 text-accent"></i><span data-i18n="sentBuilder"></span></p>
          <div id="modalOpts" class="mt-4 flex flex-wrap gap-2"></div>
          <div id="sentOut" class="mt-6 rounded-2xl border border-white/10 bg-ink-950 p-6"></div>
          <p class="mt-4 flex items-start gap-3 text-sm text-zinc-400"><i data-lucide="sparkles" class="w-4 h-4 text-accent shrink-0 mt-0.5"></i><span data-i18n="verbNote"></span></p>
        </div>
        <div id="verbGrid" class="mt-6 grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-3"></div>
      </div>
    </div>
  </section>

  <!-- 06 TRAINERS -->
  <section id="train" class="py-20 md:py-28 border-t border-white/5 bg-ink-900/40">
    <div class="max-w-4xl mx-auto px-4">
      <div class="reveal text-center max-w-2xl mx-auto">
        <p class="font-mono text-sm text-accent">06</p>
        <h2 class="mt-2 text-3xl md:text-4xl font-bold text-white tracking-tight" data-i18n="trainTitle"></h2>
        <p class="mt-3 text-zinc-400" data-i18n="trainSub"></p>
      </div>

      <div class="reveal mt-10 flex justify-center">
        <div class="inline-flex rounded-2xl border border-white/10 bg-ink-950 p-1 text-sm font-semibold">
          <button data-tab="cards" class="tab px-4 py-2.5 rounded-xl flex items-center gap-2 transition"><i data-lucide="layers" class="w-4 h-4"></i><span data-i18n="tabCards"></span></button>
          <button data-tab="quiz" class="tab px-4 py-2.5 rounded-xl flex items-center gap-2 transition"><i data-lucide="list-checks" class="w-4 h-4"></i><span data-i18n="tabQuiz"></span></button>
          <button data-tab="tones" class="tab px-4 py-2.5 rounded-xl flex items-center gap-2 transition"><i data-lucide="audio-lines" class="w-4 h-4"></i><span data-i18n="tabTones"></span></button>
        </div>
      </div>
      <div id="poolTabs" class="reveal mt-4 flex flex-wrap justify-center gap-2"></div>

      <div class="reveal mt-6 rounded-3xl border border-white/10 bg-ink-950 p-6 md:p-10 min-h-[440px]">
        <!-- Flashcards -->
        <div data-panel="cards">
          <div class="flex items-center justify-between text-sm text-zinc-500">
            <span><span data-i18n="known"></span>: <b id="fcKnown" class="text-white">0</b> / <span id="fcTotal"></span></span>
            <button id="fcReset" class="flex items-center gap-1.5 hover:text-white transition"><i data-lucide="rotate-ccw" class="w-4 h-4"></i><span data-i18n="restart"></span></button>
          </div>
          <div class="mt-3 h-1 rounded-full bg-white/5 overflow-hidden"><div id="fcBar" class="h-full bg-accent transition-all duration-500" style="width:0"></div></div>
          <div id="fcCard" class="flip mt-8 h-64 cursor-pointer select-none" tabindex="0" role="button">
            <div class="flip-inner relative w-full h-full">
              <div class="face absolute inset-0 rounded-2xl border border-white/10 bg-ink-800 grid place-items-center text-center p-6">
                <div>
                  <p id="fcFront" class="font-thai text-4xl md:text-5xl text-white leading-snug"></p>
                  <p class="mt-4 text-xs uppercase tracking-widest text-zinc-500 flex items-center justify-center gap-1.5"><i data-lucide="mouse-pointer-click" class="w-3.5 h-3.5"></i><span data-i18n="tapFlip"></span></p>
                </div>
              </div>
              <div class="face back absolute inset-0 rounded-2xl border border-accent/30 bg-ink-800 grid place-items-center text-center p-6">
                <div>
                  <p id="fcMeaning" class="text-2xl md:text-3xl font-bold text-white"></p>
                  <p id="fcLat" class="mt-3 font-mono text-accent text-lg"></p>
                  <p id="fcCyr" class="mt-1 text-zinc-400"></p>
                </div>
              </div>
            </div>
          </div>
          <div id="fcDone" class="hidden mt-8 h-64 rounded-2xl border border-emerald-400/30 bg-emerald-400/5 grid place-items-center text-center">
            <div><i data-lucide="party-popper" class="w-10 h-10 mx-auto text-emerald-400"></i><p class="mt-4 text-xl font-bold text-white" data-i18n="fcDone"></p></div>
          </div>
          <div id="fcBtns" class="mt-6 grid grid-cols-3 gap-3">
            <button id="fcAgain" class="rounded-xl border border-white/10 py-3 font-semibold hover:bg-white/5 transition flex items-center justify-center gap-2"><i data-lucide="repeat" class="w-4 h-4"></i><span data-i18n="again"></span></button>
            <button id="fcSay" class="rounded-xl border border-white/10 py-3 font-semibold hover:border-accent hover:text-accent transition flex items-center justify-center gap-2"><i data-lucide="volume-2" class="w-4 h-4"></i><span data-i18n="listen"></span></button>
            <button id="fcKnow" class="rounded-xl bg-accent text-ink-950 py-3 font-semibold hover:brightness-110 transition flex items-center justify-center gap-2"><i data-lucide="check" class="w-4 h-4"></i><span data-i18n="iKnow"></span></button>
          </div>
        </div>

        <!-- Quiz -->

const U_CYR = ['', 'нынг', 'сонг', 'сам', 'си', 'ха', 'хок', 'джет', 'пэт', 'као'];
function thaiNum(n) {
  if (n === 0) return { th: 'ศูนย์', lat: 'sǔun', cyr: 'сун' };
  const out = { th: [], lat: [], cyr: [] };
  const add = (a, b, c) => { out.th.push(a); out.lat.push(b); out.cyr.push(c) };
  const big = [[10000, 'หมื่น', 'mùuen', 'мын'], [1000, 'พัน', 'phan', 'пхан'], [100, 'ร้อย', 'rói', 'рой']];
  for (const [v, th, lat, cyr] of big) {
    const d = Math.floor(n / v) % 10;
    if (d) add(U_TH[d] + th, `${U_LAT[d]} ${lat}`, `${U_CYR[d]} ${cyr}`);
  }
  const t = Math.floor(n / 10) % 10, u = n % 10;
  if (t === 1) add('สิบ', 'sìp', 'сип');
  else if (t === 2) add('ยี่สิบ', 'yîi-sìp', 'йи-сип');
  else if (t) add(U_TH[t] + 'สิบ', `${U_LAT[t]}-sìp`, `${U_CYR[t]}-сип`);
  if (u === 1 && n > 10) add('เอ็ด', 'èt', 'эт');
  else if (u) add(U_TH[u], U_LAT[u], U_CYR[u]);
  return { th: out.th.join(''), lat: out.lat.join(' '), cyr: out.cyr.join(' ') };
}

  $('#classTabs').innerHTML = [['all', 'clsAll'], ['m', 'clsM'], ['h', 'clsH'], ['l', 'clsL']].map(([k, key]) =>

  $('#consGrid').innerHTML = CONS.map((c, i) => {
    const dim = (cls !== 'all' && c.cls !== cls) ? 'opacity-20' : (c.old ? 'opacity-50' : '');
    return `<button data-cons="${i}" class="relative aspect-square rounded-xl border ${i === selCons ? 'border-accent bg-accent/10' : 'border-white/10 bg-ink-900 hover:border-white/30'} transition grid place-items-center ${dim}">
      <span class="absolute top-1.5 left-1.5 w-1.5 h-1.5 rounded-full ${CLS_COLOR[c.cls]}"></span>
      <span class="font-thai text-2xl md:text-3xl text-white leading-none">${c.ch}</span>
      <span class="absolute bottom-1 inset-x-0 text-center font-mono text-[10px] text-zinc-500">${c.ini === '-' ? '∅' : c.ini}</span>
    </button>`;
  }).join('');
  const c = CONS[selCons], k = lang === 'ru' ? 0 : 1;
  $('#consDetail').innerHTML = `<div class="fade-up">
    <div class="flex items-start justify-between">
      <span class="font-thai text-7xl text-white leading-none">${c.ch}</span>${playBtn(c.ch + ' ' + c.word, 'w-12 h-12')}
    </div>
    <p class="mt-5 font-thai text-xl text-white">${c.ch} ${c.word}</p>
    <p class="font-mono text-accent">${c.name}</p>
    <p class="text-sm text-zinc-400">${L(c.ru, c.en)}</p>
    <dl class="mt-5 space-y-3 text-sm border-t border-white/5 pt-5">
      <div class="flex justify-between gap-4"><dt class="text-zinc-500">${t('initial')}</dt><dd class="text-right text-white"><b class="font-mono text-accent">${c.ini === '-' ? '∅' : c.ini}</b> — ${INI[c.ini][k]}</dd></div>
      <div class="flex justify-between gap-4"><dt class="text-zinc-500">${t('final')}</dt><dd class="text-right text-white">${c.fin === '-' ? '' : `<b class="font-mono text-accent">${c.fin}</b> — `}${FIN[c.fin][k]}</dd></div>
    </dl>
    <p class="mt-5 flex items-start gap-2 text-xs text-zinc-400"><span class="mt-1 w-2 h-2 shrink-0 rounded-full ${CLS_COLOR[c.cls]}"></span>${t('cls' + c.cls.toUpperCase() + 'd')}</p>
    ${c.old ? `<p class="mt-2 text-xs text-rose-300/80">${t('obsolete')}</p>` : ''}
  </div>`;
  $('#vowelGrid').innerHTML = VOWELS.map(([th, lat, ru, en]) => `
    <button data-say="${th}" class="rounded-xl border border-white/10 bg-ink-900 p-3 text-left hover:border-accent/50 transition">
      <span class="font-thai text-2xl text-white">${th}</span>
      <span class="block font-mono text-sm text-accent">${lat}</span>
      <span class="block text-xs text-zinc-500">${L(ru, en)}</span>
    </button>`).join('');
}
$('#classTabs').addEventListener('click', e => { const b = e.target.closest('[data-cls]'); if (b) { cls = b.dataset.cls; renderAlphabet(); icons() } });
$('#consGrid').addEventListener('click', e => {
  const b = e.target.closest('[data-cons]');
  if (!b) return;
  selCons = +b.dataset.cons; renderAlphabet(); icons();
  const c = CONS[selCons]; speak(c.ch + ' ' + c.word);
  if (window.innerWidth < 1024) $('#consDetail').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
});

/* --- phrases --- */
function phraseCard(x) {
  return `<article class="fade-up group rounded-2xl border border-white/10 bg-ink-900 p-6 hover:border-accent/40 transition">
    <div class="flex items-start justify-between gap-3"><p class="font-thai text-2xl text-white leading-snug">${thHTML(x)}</p>${playBtn(say(x))}</div>
    <p class="mt-2 font-mono text-sm text-accent">${latTxt(x)}</p>
    ${lang === 'ru' ? `<p class="text-sm text-zinc-500">${cyrTxt(x)}</p>` : ''}
    <p class="mt-4 font-semibold text-white">${x[lang]}</p>
    ${x.tip ? `<p class="mt-1 text-sm text-zinc-400 leading-relaxed">${L(...x.tip)}</p>` : ''}
  </article>`;
}
function renderPhrases() {
  $('#catTabs').innerHTML = CATS.map(([c, ic]) => `<button data-cat="${c}" class="${chip(c === cat)}"><i data-lucide="${ic}" class="w-3.5 h-3.5"></i>${t('cat_' + c)}</button>`).join('');
  $('#phraseGrid').innerHTML = PH.filter(x => x.c === cat && !x.bill).map(phraseCard).join('');
  const bills = PH.filter(x => x.bill);
  $('#billOpts').innerHTML = bills.map((x, i) => `<button data-bill="${i}" class="rounded-xl border px-4 py-3 text-left text-sm font-medium flex items-center gap-3 transition ${i === billI ? 'border-accent bg-accent/10 text-white' : 'border-white/10 text-zinc-400 hover:text-white'}"><i data-lucide="${x.bill}" class="w-4 h-4 shrink-0 ${i === billI ? 'text-accent' : ''}"></i>${x[lang]}</button>`).join('');
  const b = bills[billI];
  $('#billOut').innerHTML = `<div class="fade-up">
    <div class="flex items-start justify-between gap-4"><p class="font-thai text-4xl md:text-5xl text-white leading-snug">${thHTML(b)}</p>${playBtn(say(b), 'w-12 h-12')}</div>
    <p class="mt-3 font-mono text-lg text-accent">${latTxt(b)}</p>
    ${lang === 'ru' ? `<p class="text-zinc-500">${cyrTxt(b)}</p>` : ''}
    <p class="mt-4 text-xl font-semibold text-white">${b[lang]}</p>
    <p class="mt-1 text-sm text-zinc-400">${L(...b.tip)}</p></div>`;
}
$('#catTabs').addEventListener('click', e => { const b = e.target.closest('[data-cat]'); if (b) { cat = b.dataset.cat; renderPhrases(); icons() } });
$('#billOpts').addEventListener('click', e => { const b = e.target.closest('[data-bill]'); if (b) { billI = +b.dataset.bill; renderPhrases(); icons() } });

/* --- words --- */
const wordTile = (x, extra = '') => `<div class="rounded-2xl border border-white/10 bg-ink-900 p-4 hover:border-accent/40 transition">
  <div class="flex items-start justify-between gap-2"><span class="font-thai text-2xl text-white">${x.th}</span>${playBtn(x.th, 'w-9 h-9')}</div>
  <p class="mt-1 font-mono text-sm text-accent">${x.lat}</p>
  ${lang === 'ru' ? `<p class="text-xs text-zinc-500">${x.cyr}</p>` : ''}
  <p class="mt-2 text-sm font-medium text-white">${x[lang]}</p>${extra}</div>`;
function renderNum() {
  const inp = $('#numIn');
  const n = Math.max(0, Math.min(99999, parseInt(inp.value, 10) || 0));
  const r = thaiNum(n);
  $('#numOut').innerHTML = `<div class="fade-up">
    <div class="flex items-center gap-4"><span class="font-mono text-4xl font-bold text-white">${n.toLocaleString(lang)}</span><span class="font-thai text-3xl text-zinc-500">${thaiDigits(n)}</span><span class="ml-auto">${playBtn(r.th, 'w-12 h-12')}</span></div>
    <p class="mt-4 font-thai text-3xl md:text-4xl text-white break-words">${r.th}</p>
    <p class="mt-2 font-mono text-accent">${r.lat}</p>
    ${lang === 'ru' ? `<p class="text-zinc-500">${r.cyr}</p>` : ''}</div>`;
  $('#numGrid').innerHTML = NUM.map(x => `<button data-say="${x.th}" class="rounded-2xl border border-white/10 bg-ink-900 p-4 text-left hover:border-accent/40 transition">
    <div class="flex items-baseline justify-between"><span class="font-mono text-xl font-bold text-white">${x.ru}</span><span class="font-thai text-zinc-500">${x.digit}</span></div>
    <p class="mt-2 font-thai text-xl text-white">${x.th}</p><p class="font-mono text-sm text-accent">${x.lat}</p>
    ${lang === 'ru' ? `<p class="text-xs text-zinc-500">${x.cyr}</p>` : ''}</button>`).join('');
}
const setNum = v => { $('#numIn').value = Math.max(0, Math.min(99999, v)); renderNum(); icons() };
$('#numIn').addEventListener('input', () => { renderNum(); icons() });
$('#numMinus').onclick = () => setNum((+$('#numIn').value || 0) - 1);
$('#numPlus').onclick = () => setNum((+$('#numIn').value || 0) + 1);
$('#numRand').onclick = () => { setNum([20, 40, 50, 60, 80, 120, 150, 250, 350, 499, 1200, 3500][Math.random() * 12 | 0]); speak(thaiNum(+$('#numIn').value).th, $('#numOut [data-say]')) };

function renderBody() {
  $('#bodyGrid').innerHTML = BODY.map(x => wordTile(x, x.noPain ? '' :
    `<button data-say="ปวด${x.th}" class="mt-3 inline-flex items-center gap-1.5 rounded-full border border-white/10 px-2.5 py-1 text-xs text-zinc-400 hover:border-accent hover:text-accent transition"><i data-lucide="activity" class="w-3 h-3"></i>${t('hurts')} · <span class="font-thai">ปวด${x.th}</span></button>`)).join('');
}

function renderVerbs() {
  $('#modalOpts').innerHTML = MODALS.map(m => `<button data-modal="${m.k}" class="${chip(modal === m.k)}">${t('m_' + m.k)}${m.th ? ` · <span class="font-thai">${m.th}</span>` : ''}</button>`).join('');
  const v = VERB[verbI], m = MODALS.find(x => x.k === modal), p = PRONOUN[gender];
  const th = p.th + m.th + v.th;
  const lat = [p.lat, m.lat, v.lat].filter(Boolean).join(' ');
  const cyr = [p.cyr, m.cyr, v.cyr].filter(Boolean).join(' ');
  const ru = { none: `Я ${v.r1}`, want: `Я хочу ${v.ru.split(',')[0]}`, not: `Я не ${v.r1}`, will: `Я буду ${v.ru.split(',')[0]}` }[modal];
  const en = { none: `I ${v.en}`, want: `I want to ${v.en}`, not: `I don’t ${v.en}`, will: `I will ${v.en}` }[modal];
  $('#sentOut').innerHTML = `<div class="fade-up flex items-start justify-between gap-4">
    <div>
      <p class="font-thai text-3xl md:text-4xl text-white"><span class="text-zinc-400">${p.th}</span><span class="text-accent">${m.th}</span>${v.th}</p>
      <p class="mt-2 font-mono text-accent">${lat}</p>
      ${lang === 'ru' ? `<p class="text-zinc-500">${cyr}</p>` : ''}
      <p class="mt-3 text-lg font-semibold text-white">${L(ru, en)}</p>
    </div>${playBtn(th, 'w-12 h-12')}</div>`;
  $('#verbGrid').innerHTML = VERB.map((x, i) => `<button data-verb="${i}" class="text-left rounded-2xl border ${i === verbI ? 'border-accent bg-accent/10' : 'border-white/10 bg-ink-900 hover:border-white/30'} p-4 transition">
    <span class="font-thai text-2xl text-white">${x.th}</span>
    <p class="mt-1 font-mono text-sm text-accent">${x.lat}</p>
    ${lang === 'ru' ? `<p class="text-xs text-zinc-500">${x.cyr}</p>` : ''}
    <p class="mt-2 text-sm font-medium text-white">${x[lang]}</p></button>`).join('');
}
$('#modalOpts').addEventListener('click', e => { const b = e.target.closest('[data-modal]'); if (b) { modal = b.dataset.modal; renderVerbs(); icons() } });
$('#verbGrid').addEventListener('click', e => { const b = e.target.closest('[data-verb]'); if (b) { verbI = +b.dataset.verb; renderVerbs(); icons(); speak(VERB[verbI].th) } });

function renderVtabs() {
  $$('.vtab').forEach(b => { const on = b.dataset.vtab === vtab; b.classList.toggle('bg-accent', on); b.classList.toggle('text-ink-950', on); b.classList.toggle('text-zinc-400', !on) });
  $$('[data-vpanel]').forEach(p => p.classList.toggle('hidden', p.dataset.vpanel !== vtab));
}
$$('.vtab').forEach(b => b.onclick = () => { vtab = b.dataset.vtab; renderVtabs() });

/* --- hero --- */
const HERO = PH.filter(x => ['greet', 'polite', 'bye'].includes(x.c));
let heroI = 0, heroTimer;
function renderHero() {
  const x = HERO[heroI];
  $('#heroWord').innerHTML = `<div class="fade-up">
    <p class="font-thai text-5xl md:text-6xl font-semibold text-white leading-tight">${thHTML(x).replace('/80', '')}</p>
    <p class="mt-4 font-mono text-xl text-accent">${latTxt(x)}</p>
    ${lang === 'ru' ? `<p class="mt-1 text-zinc-500">${cyrTxt(x)}</p>` : ''}
    <p class="mt-4 text-xl text-zinc-200">${x[lang]}</p></div>`;
  $('#heroIdx').textContent = `${String(heroI + 1).padStart(2, '0')} / ${HERO.length}`;
  const bar = $('#heroBar');
  bar.style.transition = 'none'; bar.style.width = '0';
  requestAnimationFrame(() => requestAnimationFrame(() => { bar.style.transition = 'width 6s linear'; bar.style.width = '100%' }));
  clearTimeout(heroTimer);
  heroTimer = setTimeout(() => { heroI = (heroI + 1) % HERO.length; renderHero() }, 6000);
}
$('#heroNext').onclick = () => { heroI = (heroI + 1) % HERO.length; renderHero() };
$('#heroPlay').onclick = e => speak(say(HERO[heroI]), e.currentTarget);

/* ================= TRAINERS ================= */
const POOLS = {
  phrases: PH,
  alpha: CONS.filter(c => !c.old).map(c => ({ th: c.ch, lat: c.name, ru: `${c.word} — ${c.ru}`, en: `${c.word} — ${c.en}`, say: c.ch + ' ' + c.word, np: 1 })),
  num: NUM, body: BODY, verb: VERB
};
const items = () => POOLS[pool];

function renderPools() {
  $('#poolTabs').innerHTML = Object.keys(POOLS).map(k => `<button data-pool="${k}" class="${chip(k === pool, tab === 'tones' ? 'invisible' : '')}">${t('pool_' + k)}</button>`).join('');
}
$('#poolTabs').addEventListener('click', e => {
  const b = e.target.closest('[data-pool]');
  if (!b) return;
  pool = b.dataset.pool; renderPools(); fcReset(); qNext();
});

/* flashcards */
let deck = [], known = 0;
const fc = $('#fcCard');
function fcReset() { deck = shuffle(items().map((_, i) => i)); known = 0; fcShow() }
function fcShow() {
  const done = !deck.length, total = items().length;
  fc.classList.toggle('hidden', done);
  $('#fcDone').classList.toggle('hidden', !done);
  $('#fcBtns').classList.toggle('invisible', done);
  $('#fcKnown').textContent = known;
  $('#fcTotal').textContent = total;
  $('#fcBar').style.width = known / total * 100 + '%';
  if (done) return;
  const wasFlipped = fc.classList.contains('flipped');
  fc.classList.remove('flipped');
  setTimeout(() => {
    const x = items()[deck[0]];
    $('#fcFront').innerHTML = thHTML(x);
    $('#fcMeaning').textContent = x[lang];
    $('#fcLat').textContent = latTxt(x);
    $('#fcCyr').textContent = lang === 'ru' ? cyrTxt(x) : '';
  }, wasFlipped ? 250 : 0);
}
fc.onclick = () => fc.classList.toggle('flipped');
fc.onkeydown = e => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); fc.classList.toggle('flipped') } };
$('#fcKnow').onclick = () => { deck.shift(); known++; fcShow() };
$('#fcAgain').onclick = () => { deck.push(deck.shift()); fc.classList.add('shake'); setTimeout(() => fc.classList.remove('shake'), 400); fcShow() };
$('#fcSay').onclick = e => deck.length && speak(say(items()[deck[0]]), e.currentTarget);
$('#fcReset').onclick = fcReset;

/* quiz */
const q = { score: 0, total: 0, streak: 0, cur: 0, opts: [], lock: false };
function qNext() {
  const n = items().length;
  q.cur = Math.random() * n | 0;
  q.opts = shuffle([q.cur, ...shuffle([...Array(n).keys()].filter(i => i !== q.cur)).slice(0, 3)]);
  q.lock = false;
  qRender();
}
function qRender() {
  const x = items()[q.cur];
  $('#qPrompt').innerHTML = `<div class="fade-up">
    <p class="text-sm text-zinc-500">${t('quizQ')}</p>
    <p class="mt-4 font-thai text-4xl md:text-5xl text-white">${thHTML(x)}</p>
    <p class="mt-3 font-mono text-accent">${latTxt(x)}</p>
    <button data-say="${say(x)}" class="mt-4 inline-flex items-center gap-2 rounded-full border border-white/10 px-4 py-2 text-sm hover:border-accent hover:text-accent transition"><i data-lucide="volume-2" class="w-4 h-4"></i>${t('listen')}</button></div>`;
  $('#qOpts').innerHTML = q.opts.map(i => `<button data-q="${i}" class="fade-up rounded-xl border border-white/10 bg-ink-900 px-5 py-4 text-left font-medium hover:border-white/30 transition">${items()[i][lang]}</button>`).join('');
  $('#qScore').textContent = q.score; $('#qTotal').textContent = q.total; $('#qStreak').textContent = q.streak;
  icons();
}
$('#qOpts').addEventListener('click', e => {
  const b = e.target.closest('[data-q]');
  if (!b || q.lock) return;
  q.lock = true; q.total++;
  const ok = +b.dataset.q === q.cur;
  ok ? (q.score++, q.streak++) : (q.streak = 0);
  $$('[data-q]').forEach(el => {
    if (+el.dataset.q === q.cur) el.className += ' !border-emerald-400 !bg-emerald-400/10 text-emerald-300 pop';
    else if (el === b) el.className += ' !border-rose-400 !bg-rose-400/10 text-rose-300 shake';
    else el.className += ' opacity-40';
  });
  $('#qScore').textContent = q.score; $('#qTotal').textContent = q.total; $('#qStreak').textContent = q.streak;
  setTimeout(qNext, ok ? 900 : 1600);
});

/* tones */
const tn = { score: 0, total: 0, cur: 0, lock: false };
function tNext(play) {
  tn.cur = Math.random() * TONES.length | 0;
  tn.lock = false;
  $('#tReveal').textContent = '';
  tRender();
  if (play) speak(TONES[tn.cur].th, $('#tPlay'));
}
function tRender() {
  $('#tOpts').innerHTML = TONES.map((x, i) => `<button data-t="${i}" class="tone-btn rounded-xl border border-white/10 bg-ink-900 p-3 hover:border-white/30 transition">${curve(x.path)}<p class="mt-2 text-sm font-semibold text-white">${x[lang].n}</p></button>`).join('');
  $('#tScore').textContent = tn.score; $('#tTotal').textContent = tn.total;
}
$('#tPlay').onclick = e => speak(TONES[tn.cur].th, e.currentTarget);
$('#tHint').onclick = () => { $('#tReveal').textContent = TONES[tn.cur].lat };
$('#tOpts').addEventListener('click', e => {
  const b = e.target.closest('[data-t]');
  if (!b || tn.lock) return;
  tn.lock = true; tn.total++;
  const ok = +b.dataset.t === tn.cur, x = TONES[tn.cur];
  if (ok) tn.score++;
  $$('[data-t]').forEach(el => {
    if (+el.dataset.t === tn.cur) el.className += ' !border-emerald-400 !bg-emerald-400/10 pop';
    else if (el === b) el.className += ' !border-rose-400 !bg-rose-400/10 shake';
  });
  $('#tReveal').innerHTML = `<span class="fade-up inline-block">${x.lat} · <span class="font-thai">${x.th}</span> · <span class="text-zinc-400 font-sans text-base">${x[lang].w}</span></span>`;
  $('#tScore').textContent = tn.score; $('#tTotal').textContent = tn.total;
  setTimeout(() => tNext(true), 1800);
});

/* trainer tabs */
function renderTabs() {
  $$('.tab').forEach(b => { const on = b.dataset.tab === tab; b.classList.toggle('bg-accent', on); b.classList.toggle('text-ink-950', on); b.classList.toggle('text-zinc-400', !on) });
  $$('[data-panel]').forEach(p => p.classList.toggle('hidden', p.dataset.panel !== tab));
  renderPools();
}
$$('.tab').forEach(b => b.onclick = () => {
  const first = tab !== 'tones' && b.dataset.tab === 'tones';
  tab = b.dataset.tab; renderTabs();
  if (first) speak(TONES[tn.cur].th, $('#tPlay'));
});

/* ================= TOGGLES & INIT ================= */
function renderAll() {
  renderText(); renderSounds(); renderTones(); renderAlphabet(); renderPhrases();
  renderNum(); renderBody(); renderVerbs(); renderHero(); renderPools();
  fcShow(); qRender(); tRender(); icons();
}
$$('[data-lang]').forEach(b => b.onclick = () => { lang = b.dataset.lang; store.set('tf-lang', lang); renderAll() });
$$('[data-gender]').forEach(b => b.onclick = () => { gender = b.dataset.gender; store.set('tf-gender', gender); renderAll() });

const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target) } }), { threshold: .08 });
$$('.reveal').forEach(el => io.observe(el));

deck = shuffle(items().map((_, i) => i));
qNext();
tNext(false);
renderTabs();
renderVtabs();
renderAll();
</script>
</body>
</html>
