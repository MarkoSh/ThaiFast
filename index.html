<style>
  body { background: #09090b; }
  /* narrow phones (Galaxy Fold cover ~280px): grids may shrink, long unbroken strings wrap only if they would overflow */
  .grid > * { min-width: 0; } .font-thai, .font-mono, p, li, h3 { overflow-wrap: anywhere; }
  .flip { perspective: 1200px; }
  .flip-inner { transition: transform .6s cubic-bezier(.2,.8,.2,1); transform-style: preserve-3d; }
  .flip.flipped .flip-inner { transform: rotateY(180deg); }
  .face { backface-visibility: hidden; -webkit-backface-visibility: hidden; }
  .face.back { transform: rotateY(180deg); }
  .reveal { opacity: 0; transform: translateY(24px); transition: opacity .7s, transform .7s cubic-bezier(.2,.8,.2,1); }
  .reveal.in { opacity: 1; transform: none; }
  .tone-path { stroke-dasharray: 100; stroke-dashoffset: 100; transition: stroke-dashoffset .9s cubic-bezier(.2,.8,.2,1); }
  .reveal.in .tone-path, .tone-btn .tone-path { stroke-dashoffset: 0; }
  @keyframes shake { 20%,60% { transform: translateX(-6px) } 40%,80% { transform: translateX(6px) } }
  .shake { animation: shake .4s; }
  @keyframes pop { 50% { transform: scale(1.04) } }
  .pop { animation: pop .35s; }
  @keyframes pulseRing { 0% { box-shadow: 0 0 0 0 rgba(232,176,75,.55) } 100% { box-shadow: 0 0 0 14px rgba(232,176,75,0) } }
  .speaking { animation: pulseRing 1s infinite; color: #e8b04b; border-color: #e8b04b; }
  .kb-key { position: relative; height: 3.5rem; border-radius: .6rem; border: 1px solid #ffffff1a; background: #0d0e11; transition: background .15s, border-color .15s, transform .1s; }
  .kb-key:hover { background: #ffffff0d; } .kb-key:active { transform: translateY(1px); }
  .kb-tall .kb-key { height: 4.75rem; } .kb-tall .kb-key .text-xs { font-size: .9rem; }
  .kb-used { border-color: #e8b04b80; } .kb-shift-on { background: #e8b04b26; }
  .kb-on, .kb-on * { background: #e8b04b !important; color: #09090b !important; border-color: #e8b04b !important; }
  #navMenu:not(.hidden) { animation: navIn .2s ease-out; } @keyframes navIn { from { opacity: 0; transform: translateY(-6px) } }
  .say-th { cursor: pointer; color: #e4e4e7; text-decoration: underline dotted #e8b04b80; text-underline-offset: 4px; transition: color .2s; }
  .say-th:hover, .say-th.speaking { color: #e8b04b; animation: none; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(8px) } to { opacity: 1; transform: none } }
  .fade-up { animation: fadeUp .45s cubic-bezier(.2,.8,.2,1); }
  .grid-bg { background-image: linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px); background-size: 48px 48px; }
  input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; }
  input[type=number] { -moz-appearance: textfield; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } .reveal { opacity: 1; transform: none; } }
</style>

<!-- NAV -->

<main id="top">
  <!-- HERO -->
  <section class="relative overflow-hidden pt-32 pb-20 md:pt-40 md:pb-28 grid-bg">
    <div class="absolute -top-40 left-1/2 -translate-x-1/2 w-[900px] h-[600px] rounded-full bg-accent/10 blur-3xl pointer-events-none"></div>
    <div class="relative max-w-6xl mx-auto px-4 grid md:grid-cols-2 gap-12 items-center">
      <div class="reveal">
        <div class="inline-flex items-center gap-2 rounded-full border border-white/10 bg-white/5 px-3 py-1 text-xs text-zinc-400">

        </div>
        <h1 class="mt-6 text-4xl md:text-6xl font-extrabold tracking-tight text-white leading-[1.05]" data-i18n="heroTitle"></h1>

        <div class="mt-8 flex flex-wrap gap-3">

            <span data-i18n="ctaStart"></span><i data-lucide="arrow-right" class="w-4 h-4"></i>

          <a href="#train" class="inline-flex items-center gap-2 rounded-xl border border-white/10 px-5 py-3 font-semibold text-white hover:bg-white/5 transition">

        </div>

          <div><dt class="text-2xl font-bold text-white" id="statPhrases"></dt><dd class="text-zinc-500" data-i18n="statPhrases"></dd></div>
          <div><dt class="text-2xl font-bold text-white" id="statWords"></dt><dd class="text-zinc-500" data-i18n="statWords"></dd></div>
        </dl>
      </div>

      <div class="reveal">
        <div class="relative rounded-3xl border border-white/10 bg-ink-900/80 p-8 shadow-2xl shadow-black/50">

            </div>
          </div>
        </div>
      </div>

  <!-- 01 SOUNDS -->

        <i data-lucide="ruler" class="w-5 h-5 text-accent shrink-0 mt-0.5"></i>
        <p class="text-zinc-300" data-i18n="lengthNote"></p>
      </div>
    </div>
  </section>

  <!-- 02 TONES -->
  <section id="tones" class="py-20 md:py-28 border-t border-white/5 bg-ink-900/40">
    <div class="max-w-6xl mx-auto px-4">
      <div class="reveal max-w-2xl">
        <p class="font-mono text-sm text-accent">02</p>
        <h2 class="mt-2 text-3xl md:text-4xl font-bold text-white tracking-tight" data-i18n="tonesTitle"></h2>

          <p class="mt-1 text-sm text-zinc-400" data-i18n="twisterTr"></p>
        </div>
        <button data-say="ไม้ใหม่ไม่ไหม้ไหม" class="self-start md:self-auto inline-flex items-center gap-2 rounded-xl border border-white/15 px-4 py-2.5 text-sm font-semibold hover:border-accent hover:text-accent transition">

  <!-- 03 ALPHABET -->

      <div class="reveal flex flex-col md:flex-row md:items-end justify-between gap-6">

        </div>
      </div>
      <div class="reveal mt-10 rounded-3xl border border-white/10 bg-ink-900/60 p-5 md:p-8">
        <div class="flex flex-col md:flex-row md:items-start justify-between gap-4">
          <div class="max-w-2xl">
            <h3 class="text-xl font-bold text-white flex items-center gap-2"><i data-lucide="layout-grid" class="w-5 h-5 text-accent"></i><span data-i18n="posterTitle"></span></h3>

        <div id="vowelGrid" class="mt-6 grid grid-cols-3 sm:grid-cols-5 lg:grid-cols-8 gap-2"></div>
      </div>
    </div>
  </section>

  <!-- 04 PHRASES -->

      <div class="reveal max-w-2xl">
        <p class="font-mono text-sm text-accent">04</p>
        <h2 class="mt-2 text-3xl md:text-4xl font-bold text-white tracking-tight" data-i18n="phrasesTitle"></h2>

        </div>
      </div>
    </div>
  </section>

  <!-- 05 WORDS -->

          <div id="modalOpts" class="mt-4 flex flex-wrap gap-2"></div>

  { c: 'greet', th: 'กินข้าวยัง', lat: 'gin khâao yang', cyr: 'кин кхао йанг?', ru: 'Поел уже?', en: 'Eaten yet?', tip: ['Тайское «как ты?» — забота, а не приглашение. Ответ: กินแล้ว (gin láew) — «уже поел».', 'Thai for “how are you?” — care, not an invite. Reply: กินแล้ว (gin láew), “already ate”.'] },
  { c: 'greet', th: 'ไปไหนมา', lat: 'bpai nǎi maa', cyr: 'пай най ма?', ru: 'Где был?', en: 'Where’ve you been?', tip: ['Приветствие, а не допрос. Можно ответить ไปเที่ยวมา (bpai thîao maa) — «гулял».', 'A greeting, not a question to answer in detail. Say ไปเที่ยวมา (bpai thîao maa), “out and about”.'] },
  { c: 'greet', th: 'ยินดีที่ได้รู้จัก', lat: 'yin-dii thîi dâai rúu-jàk', cyr: 'йин-ди тхи дай ру-джак', ru: 'Приятно познакомиться', en: 'Nice to meet you', tip: ['Вежливо и чуть официально — для первой встречи, деловой или с семьёй.', 'Polite and a bit formal — for first meetings, work or family.'] },
  // polite
  { c: 'polite', th: 'ขอบคุณ', lat: 'khòp-khun', cyr: 'кхоп-кхун', ru: 'Спасибо', en: 'Thank you', tip: ['«кх» — это «к» с выдохом. «п» в конце не взрывается — губы просто смыкаются.', '“kh” is k with a puff of air. The final “p” is unreleased.'] },
  { c: 'polite', th: 'ขอบคุณมาก', lat: 'khòp-khun mâak', cyr: 'кхоп-кхун мак', ru: 'Большое спасибо', en: 'Thanks a lot' },
  { c: 'polite', np: 1, th: 'ขอบใจนะ', lat: 'khòp-jai ná', cyr: 'кхоп-джай на', ru: 'Спасибки', en: 'Thanks (casual)', tip: ['Друзьям и тем, кто младше. Старшим — только ขอบคุณ.', 'For friends and younger people. To elders, always ขอบคุณ.'] },
  { c: 'polite', np: 1, th: 'ตามสบาย', lat: 'dtaam sà-baai', cyr: 'там са-бай', ru: 'Располагайтесь / Как вам удобно', en: 'Make yourself at home', tip: ['Очень тайское: «не напрягайтесь, как удобно». Услышите в гостях и в кафе.', 'Very Thai: “relax, whatever suits you”. You’ll hear it as a guest.'] },
  { c: 'polite', th: 'รบกวนหน่อย', lat: 'róp-guan nòi', cyr: 'роп-куан ной', ru: 'Будьте добры / Можно вас?', en: 'Excuse me, could you…', tip: ['Так начинают любую просьбу к незнакомому. กรุณา — книжное слово, его пишут на табличках.', 'How you open any request to a stranger. กรุณา is the written word you see on signs.'] },
  { c: 'polite', th: 'ขอโทษ', lat: 'khǒr-thôht', cyr: 'кхо-тхот', ru: 'Извините', en: 'Sorry / Excuse me', tip: ['«r» не произносится — это знак долгого «о». Подходит и чтобы пройти в толпе.', 'The “r” is silent — it marks a long “o”. Also works to get past people.'] },
  { c: 'polite', th: 'ไม่เป็นไร', lat: 'mâi bpen rai', cyr: 'май пен рай', ru: 'Ничего страшного', en: 'No worries', tip: ['Главная тайская фраза: и «не за что», и «ничего страшного», и «да ладно». «bp» — между «б» и «п».', 'The most Thai phrase: “you’re welcome”, “never mind”, “it’s fine”. “bp” sits between b and p.'] },
  // bye
  { c: 'bye', th: 'ไปก่อนนะ', lat: 'bpai gòn ná', cyr: 'пай кон на', ru: 'Ну, я пошёл / Пока', en: 'I’m off / Bye', tip: ['Самое обычное прощание. นะ в конце смягчает фразу.', 'The everyday goodbye. นะ softens it.'] },
  { c: 'bye', th: 'ไว้เจอกันใหม่นะ', lat: 'wái jer gan mài ná', cyr: 'вай джё кан май на', ru: 'Ещё увидимся', en: 'We’ll meet again', tip: ['Тёплое прощание, когда не знаете, когда встретитесь.', 'A warm goodbye when you don’t know when you’ll meet.'] },
  { c: 'bye', th: 'โชคดีนะ', lat: 'chôhk-dii ná', cyr: 'чхок ди на', ru: 'Всего хорошего / Удачи', en: 'Good luck / Take care', tip: ['Тёплое прощание с друзьями и попутчиками.', 'A warm goodbye to friends and fellow travellers.'] },
  { c: 'bye', th: 'เจอกันพรุ่งนี้นะ', lat: 'jer gan phrûng-níi ná', cyr: 'джё кан пхрунг-ни на', ru: 'До завтра', en: 'See you tomorrow', tip: ['«нг» в «пхрунг» — один носовой звук, без «г» в конце.', '“ng” in “phrûng” is one nasal sound, no hard g.'] },
  { c: 'bye', th: 'เจอกันตอนเย็นนะ', lat: 'jer gan dton-yen ná', cyr: 'джё кан тон-йен на', ru: 'До вечера', en: 'See you this evening', tip: ['ตอนเย็น — «вечером», примерно с 16 до 19. Позже — ตอนค่ำ (тон кхам).', 'ตอนเย็น is “in the evening”, roughly 4–7 pm. Later is ตอนค่ำ (dton khâm).'] },
  { c: 'bye', th: 'พักผ่อนเยอะๆ นะ', lat: 'phák-phòn yóe-yóe ná', cyr: 'пхак-пхон йё-йё на', ru: 'Хорошего вечера / Отдыхайте', en: 'Have a good evening / Get some rest', tip: ['Дословного «хорошего вечера» у тайцев нет — вечером на прощание желают как следует отдохнуть. ๆ — повтор слова.', 'Thai has no set “have a good evening”: in the evening people wish you a good rest. ๆ repeats the word.'] },
  { c: 'bye', th: 'ฝันดีนะ', lat: 'fǎn dii ná', cyr: 'фан ди на', ru: 'Доброй ночи', en: 'Good night', tip: ['Дословно «сладких снов». Тёплое и повседневное — друзьям, знакомым, в переписке.', 'Literally “sweet dreams”. Warm and everyday — friends, acquaintances, messages.'] },
  { c: 'bye', th: 'ราตรีสวัสดิ์', lat: 'raa-dtrii sà-wàt', cyr: 'ра-три са-ват', ru: 'Спокойной ночи (учтиво)', en: 'Good night (formal)', tip: ['Пара к สวัสดี: торжественнее и учтивее, чем ฝันดี. С ครับ — красиво для старших, хозяев, персонала отеля.', 'The evening twin of สวัสดี: more formal than ฝันดี. With ครับ it’s a graceful good night to elders, hosts or hotel staff.'] },
  { c: 'bye', th: 'แล้วเจอกัน', lat: 'láew jer gan', cyr: 'лэо джё кан', ru: 'Увидимся', en: 'See you', tip: ['«лэо» — широкое «э», как в англ. cat.', '“láew” uses the open “ae” of “cat”.'] },
  { c: 'bye', th: 'ไว้คราวหน้านะ', lat: 'wái khraao nâa ná', cyr: 'вай кхрао на на', ru: 'В следующий раз', en: 'Next time', tip: ['Мягко отказаться или отложить: продавцу, другу, таксисту.', 'Softly decline or postpone — to a seller, friend or driver.'] },
  { c: 'bye', th: 'ขอให้เป็นวันที่ดี', lat: 'khǒr hâi bpen wan thîi dii', cyr: 'кхо хай пен ван тхи ди', ru: 'Хорошего дня', en: 'Have a nice day', tip: ['Звучит вежливо, но книжно — так пишут в сообщениях. Вживую чаще говорят โชคดีนะ.', 'Polite but bookish — more for messages. In person, say โชคดีนะ.'] },
  // food
  { c: 'food', th: 'ขอเมนูหน่อย', lat: 'khǒr mee-nuu nòi', cyr: 'кхо мэ-ну ной', ru: 'Можно меню?', en: 'Menu, please', tip: ['ขอ … หน่อย = «дайте … пожалуйста». Самая полезная конструкция.', 'ขอ … หน่อย = “can I have …”. The most useful pattern.'] },
  { c: 'food', th: 'เอาอันนี้', lat: 'ao an-níi', cyr: 'ао ан-ни', ru: 'Мне вот это', en: 'This one, please', tip: ['Ткнуть пальцем в меню + เอาอันนี้ = заказ на любом языке.', 'Point at the menu + เอาอันนี้ = ordering in any language.'] },
  { c: 'food', th: 'ขอน้ำเปล่าหน่อย', lat: 'khǒr náam bplàao nòi', cyr: 'кхо нам плао ной', ru: 'Воды, пожалуйста', en: 'Water, please', tip: ['น้ำเปล่า — простая вода. Со льдом — ใส่น้ำแข็ง (sài náam-khǎeng).', 'น้ำเปล่า is plain water. With ice — ใส่น้ำแข็ง (sài náam-khǎeng).'] },
  { c: 'food', th: 'ไม่เอาเผ็ด', lat: 'mâi ao phèt', cyr: 'май ао пхет', ru: 'Не острое', en: 'Not spicy', tip: ['«ph» — «п» с выдохом, не «ф».', '“ph” is p + breath, not f.'] },
  { c: 'food', th: 'เผ็ดนิดหน่อย', lat: 'phèt nít-nòi', cyr: 'пхет нит-ной', ru: 'Чуть-чуть остро', en: 'A little spicy', tip: ['Тайское «чуть-чуть» — всё равно остро. Сомневаетесь — ไม่เอาเผ็ด.', 'Thai “a little” is still hot. When in doubt, ไม่เอาเผ็ด.'] },
  { c: 'food', th: 'ไม่ใส่ผักชี', lat: 'mâi sài phàk-chii', cyr: 'май сай пхак-чхи', ru: 'Без кинзы', en: 'No cilantro', tip: ['ไม่ใส่ … = «без …». ไม่ใส่น้ำตาล — без сахара.', 'ไม่ใส่ … = “without …”. ไม่ใส่น้ำตาล — no sugar.'] },
  { c: 'food', th: 'แพ้ถั่ว', lat: 'pháe thùa', cyr: 'пхэ тхуа', ru: 'У меня аллергия на орехи', en: 'I’m allergic to nuts', tip: ['แพ้ + продукт = аллергия. แพ้กุ้ง — на креветки.', 'แพ้ + food = allergy. แพ้กุ้ง — to shrimp.'] },
  { c: 'food', th: 'อร่อยมาก', lat: 'à-ròi mâak', cyr: 'а-рой мак', ru: 'Очень вкусно', en: 'So good', tip: ['Скажите повару — улыбка гарантирована.', 'Tell the cook — guaranteed smile.'] },
  { c: 'food', th: 'กลับบ้าน', lat: 'glàp bâan', cyr: 'клап бан', ru: 'С собой', en: 'To go', tip: ['Дословно «домой». Ответ на вопрос «ทานที่นี่ไหม» — «здесь будете?».', 'Literally “go home”. The answer to “eating here?”'] },
  { c: 'food', bill: 'receipt', th: 'ขอเก็บตังค์หน่อย', lat: 'khǒr gèp dtang nòi', cyr: 'кхо кеп танг ной', ru: 'Счёт, пожалуйста', en: 'Check, please', tip: ['Так говорят сами тайцы: дословно «соберите деньги, пожалуйста». Туристический вариант — เช็คบิล (chék bin, «чек бин»). Или жест: «распишитесь» пальцем в воздухе.', 'What Thais actually say: literally “please collect the money”. The tourist version is เช็คบิล (chék bin). Or mime signing in the air.'] },
  { c: 'food', bill: 'split', th: 'แยกจ่ายได้ไหม', lat: 'yâek jàai dâai mǎi', cyr: 'йэк джай дай май?', ru: 'Можно раздельно?', en: 'Can we pay separately?', tip: ['แยก — «отдельно». Пополам: หารกัน (hǎan gan) — «поделим».', 'แยก means separate. Split evenly: หารกัน (hǎan gan).'] },
  { c: 'food', bill: 'merge', th: 'รวมกันเลย', lat: 'ruam gan loei', cyr: 'руам кан лёй', ru: 'Всё вместе', en: 'All together', tip: ['Одним счётом на всех. รวม — «объединить».', 'One bill for the table. รวม means combine.'] },
  { c: 'food', bill: 'credit-card', th: 'รูดบัตรได้ไหม', lat: 'rûut bàt dâai mǎi', cyr: 'рут бат дай май?', ru: 'Можно картой?', en: 'Can I pay by card?', tip: ['รูด — «провести» картой. По QR платят почти везде: โอนได้ไหม (ohn dâai mǎi) — «можно переводом?». Наличные — เงินสด.', 'รูด means swipe. QR payments are everywhere: โอนได้ไหม (ohn dâai mǎi). Cash is เงินสด.'] },
  { c: 'food', bill: 'gift', th: 'เดี๋ยวเลี้ยงเอง', lat: 'dǐao líang eeng', cyr: 'дьяо лианг энг', ru: 'Я угощаю', en: 'It’s on me', tip: ['Дословно «сейчас сам угощу». Тайцы оценят.', 'Literally “I’ll treat”. Thais appreciate it.'] },
  { c: 'food', bill: 'coins', th: 'ไม่ต้องทอน', lat: 'mâi dtông thon', cyr: 'май тонг тхон', ru: 'Сдачи не надо', en: 'Keep the change', tip: ['ทอน — давать сдачу.', 'ทอน means give change.'] },
  // travel
  { c: 'travel', th: 'ห้องน้ำอยู่ไหน', lat: 'hông-náam yùu nǎi', cyr: 'хонг-нам ю най?', ru: 'Где туалет?', en: 'Where’s the toilet?', tip: ['… อยู่ไหน — «где …». Подставьте любое место.', '… อยู่ไหน = “where’s …”. Plug in any place.'] },
  { c: 'travel', th: 'ไปสนามบินไหม', lat: 'bpai sà-nǎam-bin mǎi', cyr: 'пай са-нам-бин май?', ru: 'До аэропорта довезёте?', en: 'Going to the airport?', tip: ['Так тайцы ловят такси: сначала спрашивают, поедет ли водитель. Подставьте любое место.', 'How Thais hail a taxi: first ask if the driver will go there. Swap in any place.'] },
  { c: 'travel', th: 'ไปมิเตอร์ไหม', lat: 'bpai mí-dtôer mǎi', cyr: 'пай ми-тё май?', ru: 'По счётчику поедете?', en: 'Meter OK?', tip: ['Спросите до посадки. Без счётчика цена бывает в разы выше.', 'Ask before getting in. Without the meter the fare can be much higher.'] },
  { c: 'travel', np: 1, th: 'ตรงนี้แหละ', lat: 'dtrong-níi làe', cyr: 'тронг-ни лэ', ru: 'Вот здесь!', en: 'Right here!', tip: ['แหละ — «именно, вот». Так говорят, когда приехали.', 'แหละ means “exactly”. What you say when you’ve arrived.'] },
  { c: 'travel', th: 'เท่าไหร่', lat: 'thâo-rài', cyr: 'тхао-рай?', ru: 'Сколько?', en: 'How much?', tip: ['Главное слово на рынке и в тук-туке.', 'Your best friend at markets and tuk-tuks.'] },
  { c: 'travel', th: 'ลดได้ไหม', lat: 'lót dâai mǎi', cyr: 'лот дай май?', ru: 'Скинете?', en: 'Can you go lower?', tip: ['Торгуйтесь с улыбкой — это игра, а не спор. แพงไป (phaeng bpai) — «дороговато».', 'Bargain with a smile — it’s a game. แพงไป (phaeng bpai) — “too pricey”.'] },
  { c: 'travel', np: 1, th: 'ตรงไป', lat: 'dtrong bpai', cyr: 'тронг пай', ru: 'Прямо', en: 'Straight ahead' },
  { c: 'travel', np: 1, th: 'เลี้ยวซ้าย', lat: 'líao sáai', cyr: 'лиао сай', ru: 'Налево', en: 'Turn left' },
  { c: 'travel', np: 1, th: 'เลี้ยวขวา', lat: 'líao khwǎa', cyr: 'лиао кхва', ru: 'Направо', en: 'Turn right' },
  { c: 'travel', th: 'จอดตรงนี้', lat: 'jòt dtrong-níi', cyr: 'джот тронг-ни', ru: 'Остановите здесь', en: 'Stop here' },
  { c: 'travel', th: 'ไกลไหม', lat: 'glai mǎi', cyr: 'клай май?', ru: 'Далеко?', en: 'Is it far?' },
  // hotel
  { c: 'hotel', th: 'มีห้องว่างไหม', lat: 'mii hông wâang mǎi', cyr: 'ми хонг ванг май?', ru: 'Есть свободные номера?', en: 'Any rooms free?' },
  { c: 'hotel', th: 'จองไว้แล้ว', lat: 'jong wái láew', cyr: 'джонг вай лэо', ru: 'У меня бронь', en: 'I have a booking' },
  { c: 'hotel', th: 'เช็คเอาท์กี่โมง', lat: 'chék-áo gìi mohng', cyr: 'чек-ао ки монг?', ru: 'Во сколько выезд?', en: 'What time is check-out?' },
  { c: 'hotel', th: 'ไวไฟรหัสอะไร', lat: 'wai-fai rá-hàt à-rai', cyr: 'вай-фай ра-хат а-рай?', ru: 'Какой пароль от вайфая?', en: 'What’s the Wi-Fi password?' },
  { c: 'hotel', th: 'แอร์ไม่เย็น', lat: 'ae mâi yen', cyr: 'э май йен', ru: 'Кондиционер не холодит', en: 'The AC isn’t cold', tip: ['Самая частая жалоба. Сломалось совсем — เสีย (sǐa): แอร์เสีย, ทีวีเสีย.', 'The classic complaint. Totally broken — เสีย (sǐa): แอร์เสีย.'] },
  { c: 'hotel', th: 'ขอผ้าเช็ดตัวเพิ่ม', lat: 'khǒr phâa-chét-dtua phôem', cyr: 'кхо пха-чет-туа пхём', ru: 'Ещё полотенце, пожалуйста', en: 'More towels, please' },
  { c: 'hotel', th: 'ฝากกระเป๋าได้ไหม', lat: 'fàak grà-bpǎo dâai mǎi', cyr: 'фак кра-пао дай май?', ru: 'Можно оставить вещи?', en: 'Can I leave my bags?' },
  // meet
  { c: 'meet', th: 'ชื่ออะไร', lat: 'chûue à-rai', cyr: 'чхы а-рай?', ru: 'Как тебя зовут?', en: 'What’s your name?', tip: ['«ы» в ชื่อ — как русское «ы», только долго. «Меня зовут…» — ชื่อ… и имя.', 'The vowel in ชื่อ is a smiling “oo”. “I’m …” — ชื่อ + name.'] },
  { c: 'meet', th: 'ชื่ออเล็กซ์', lat: 'chûue à-lék', cyr: 'чхы а-лек', ru: 'Меня зовут Алекс', en: 'I’m Alex', tip: ['Тайцы обычно опускают «я»: ชื่อ + имя + ครับ. Полностью — ผมชื่อ… (он) или ฉันชื่อ… (она). Подставьте своё имя.', 'Thais usually drop the “I”: ชื่อ + name + ครับ. In full: ผมชื่อ… (he) or ฉันชื่อ… (she). Put in your own name.'] },
  { c: 'meet', th: 'ชื่อเล่นชื่ออะไร', lat: 'chûue-lên chûue à-rai', cyr: 'чхы-лен чхы а-рай?', ru: 'А как тебя зовут по-простому?', en: 'What’s your nickname?', tip: ['У каждого тайца есть ชื่อเล่น — короткое домашнее имя: Нок, Мэй, Бём. Им зовут все, даже на работе, а длинное официальное имя — для документов.', 'Every Thai has a ชื่อเล่น, a short nickname like Nok, May or Bam. Everyone uses it, even at work; the long official name is for documents.'] },
  { c: 'meet', th: 'มาจากไหน', lat: 'maa jàak nǎi', cyr: 'ма джак най?', ru: 'Откуда ты?', en: 'Where are you from?' },

/* ================= NUMBER → THAI ================= */
const U_TH = ['', 'หนึ่ง', 'สอง', 'สาม', 'สี่', 'ห้า', 'หก', 'เจ็ด', 'แปด', 'เก้า'];
const U_LAT = ['', 'nùeng', 'sǒng', 'sǎam', 'sìi', 'hâa', 'hòk', 'jèt', 'bpàet', 'gâo'];
const U_CYR = ['', 'нынг', 'сонг', 'сам', 'си', 'ха', 'хок', 'джет', 'пэт', 'као'];
function thaiNum(n) {
  if (n === 0) return { th: 'ศูนย์', lat: 'sǔun', cyr: 'сун', parts: ['ศูนย์'] };
  const out = { th: [], lat: [], cyr: [] };
  const add = (a, b, c) => { out.th.push(a); out.lat.push(b); out.cyr.push(c) };
  const big = [[10000, 'หมื่น', 'mùuen', 'мын'], [1000, 'พัน', 'phan', 'пхан'], [100, 'ร้อย', 'rói', 'рой']];
  for (const [v, th, lat, cyr] of big) {
    const d = Math.floor(n / v) % 10;
    if (d) add(U_TH[d] + th, `${U_LAT[d]} ${lat}`, `${U_CYR[d]} ${cyr}`);
  }
  const t = Math.floor(n / 10) % 10, u = n % 10;
  if (t === 1) add('สิบ', 'sìp', 'сип');
  else if (t === 2) add('ยี่สิบ', 'yîi-sìp', 'йи-сип');
  else if (t) add(U_TH[t] + 'สิบ', `${U_LAT[t]}-sìp`, `${U_CYR[t]}-сип`);
  if (u === 1 && n > 10) add('เอ็ด', 'èt', 'эт');
  else if (u) add(U_TH[u], U_LAT[u], U_CYR[u]);
  return { th: out.th.join(''), lat: out.lat.join(' '), cyr: out.cyr.join(' '), parts: out.th };
}
const thaiDigits = n => String(n).replace(/\d/g, d => '๐๑๒๓๔๕๖๗๘๙'[d]);

function orderPhrase(it, n) {
  const c = CLS.find(x => x.th === it.cls), [, nth, nlat, ncyr] = ORDER_N[n - 1];
  return n === 1

}

/* ================= FACTS ================= */
// c: phys | body | lang; Thai words inside the text are tappable (see sayThai) and voiced (tools/texts.js)
const FACTS = [
  { c: 'phys', icon: 'sun', t: ['Почему небо голубое', 'Why the sky is blue'], d: ['Небо — ท้องฟ้า (thóng-fáa, небо) — голубое, потому что воздух рассеивает синий свет сильнее красного. На закате луч идёт сквозь толстый слой воздуха, синий теряется по дороге, и остаётся оранжево-красный.', 'The sky — ท้องฟ้า (thóng-fáa, sky) — is blue because air scatters blue light more than red. At sunset the light crosses a thick layer of air, the blue is lost on the way, and orange-red is left.'] },
  { c: 'phys', icon: 'snowflake', t: ['Лёд легче воды', 'Ice is lighter than water'], d: ['Лёд — น้ำแข็ง (náam-khǎeng, лёд, дословно «твёрдая вода») — плавает: замерзая, вода расширяется почти на 9%. Поэтому озёра замерзают сверху, рыба зимует подо льдом, а забытая в морозилке бутылка может лопнуть.', 'Ice — น้ำแข็ง (náam-khǎeng, ice, literally “hard water”) — floats: water expands by almost 9% as it freezes. That is why lakes freeze from the top, fish winter under the ice and a bottle forgotten in the freezer can burst.'] },
  { c: 'phys', icon: 'zap', t: ['Зимой бьёт током', 'Winter shocks'], d: ['Зимой током бьёт чаще: сухой воздух не уносит заряд, и он копится на теле. Это ไฟฟ้าสถิต (fai-fáa sà-thìt, статическое электричество). Коснитесь металла сначала ключом — искра уйдёт в ключ, а не в палец.', 'Static shocks are more common in winter: dry air does not carry the charge away, so it builds up on your body. That is ไฟฟ้าสถิต (fai-fáa sà-thìt, static electricity). Touch metal with a key first and the spark jumps to the key, not your finger.'] },
  { c: 'phys', icon: 'rainbow', t: ['У каждого своя радуга', 'Everyone has their own rainbow'], d: ['Радуга — รุ้ง (rúng, радуга) — всегда напротив солнца: встаньте к солнцу спиной, и её центр окажется ровно в тени вашей головы. Человек рядом видит уже другую радугу — её рисуют другие капли.', 'A rainbow — รุ้ง (rúng, rainbow) — is always opposite the sun: stand with your back to the sun and its centre lies exactly in the shadow of your head. The person next to you sees a different rainbow made by other drops.'] },
  { c: 'phys', icon: 'thermometer', t: ['Металл «холоднее» дерева', 'Metal feels colder than wood'], d: ['Металлическая и деревянная ложки лежат в одной комнате и одинаковой температуры, но металл кажется холоднее: он быстрее отводит тепло от пальцев. Кожа чувствует не температуру — เย็น (yen, прохладно) — а скорость, с которой уходит тепло.', 'A metal spoon and a wooden one lie in the same room at the same temperature, yet the metal feels colder: it draws heat from your fingers faster. Skin senses not temperature — เย็น (yen, cool) — but how fast heat leaves.'] },
  { c: 'phys', icon: 'glasses', t: ['Очки гасят экран', 'Sunglasses that switch off a screen'], d: ['Наденьте поляризованные แว่นกันแดด (wâen gan dàet, солнечные очки) и поворачивайте телефон: под каким-то углом экран почернеет. Свет экрана тоже поляризован — когда «решётки» очков и экрана встают поперёк, свет не проходит.', 'Put on polarized แว่นกันแดด (wâen gan dàet, sunglasses) and rotate your phone: at some angle the screen goes black. The screen’s light is polarized too — when the two “grids” cross, no light gets through.'] },
  { c: 'phys', icon: 'droplets', t: ['Почему плачем от лука', 'Why onions make you cry'], d: ['Лук — หัวหอม (hǔa-hǒm, лук) — заставляет плакать: при разрезании ферменты превращают его вещества в летучий газ, который раздражает глаза. Охладите луковицу и режьте острым ножом — клеток повреждается меньше, газа тоже.', 'Onions — หัวหอม (hǔa-hǒm, onion) — make you cry: cutting lets enzymes turn their compounds into a volatile gas that irritates the eyes. Chill the onion and use a sharp knife: fewer cells are crushed, so less gas.'] },
  { c: 'phys', icon: 'apple', t: ['Почему темнеет яблоко', 'Why a cut apple turns brown'], d: ['Срез แอปเปิล (áep-pôen, яблоко) темнеет: фермент вместе с кислородом окисляет вещества яблока. Капните มะนาว (má-naao, лайм) — кислота и витамин C тормозят реакцию, и долька остаётся светлой.', 'A cut แอปเปิล (áep-pôen, apple) turns brown: an enzyme and oxygen oxidize the apple’s compounds. A drop of มะนาว (má-naao, lime) — its acid and vitamin C slow the reaction and the slice stays pale.'] },
  { c: 'phys', icon: 'sparkles', t: ['Перец убегает от мыла', 'Pepper runs from soap'], d: ['Насыпьте พริกไทย (phrík-thai, чёрный перец, дословно «тайский перец») на воду в тарелке и коснитесь центра пальцем с мылом: перец разбежится к краям. Мыло ослабляет поверхностное натяжение в центре, и плёнка воды тянет перчинки наружу.', 'Sprinkle พริกไทย (phrík-thai, black pepper, literally “Thai pepper”) on a plate of water and touch the middle with a soapy finger: the pepper dashes to the edges. Soap weakens the surface tension in the centre and the water’s skin pulls the flakes outward.'] },
  { c: 'phys', icon: 'cloud', t: ['Пар невидим', 'Steam is invisible'], d: ['Посмотрите на кипящий чайник: прямо у носика есть прозрачный промежуток. Настоящий пар — ไอน้ำ (ai-náam, водяной пар) — невидим; белое облачко — это уже капельки, которые остыли и снова стали водой.', 'Look at a boiling kettle: right at the spout there is a clear gap. Real steam — ไอน้ำ (ai-náam, water vapour) — is invisible; the white cloud is tiny droplets that have cooled and turned back into water.'] },
  { c: 'phys', icon: 'cup-soda', t: ['«Сломанная» трубочка', 'The “broken” straw'], d: ['Трубочка — หลอด (lòt, трубочка) — в стакане воды кажется сломанной: на границе воды и воздуха свет меняет направление. Из-за того же преломления бассейн кажется мельче, чем он есть.', 'A straw — หลอด (lòt, straw) — looks broken in a glass of water: light changes direction at the boundary between water and air. The same refraction makes a pool look shallower than it really is.'] },
  { c: 'phys', icon: 'shower-head', t: ['Занавеска липнет в душе', 'The clingy shower curtain'], d: ['Занавеска тянется к вам, когда включён ฝักบัว (fàk-bua, душ): струи раскручивают воздух в вихрь, и в его центре давление падает. Явление настолько знакомо всем, что физики даже моделировали его на суперкомпьютере.', 'The curtain creeps toward you when the ฝักบัว (fàk-bua, shower) is on: the spray spins the air into a vortex with low pressure at its centre. It is so familiar that physicists have even simulated it on a supercomputer.'] },
  { c: 'phys', icon: 'flip-horizontal-2', t: ['Что меняет зеркало', 'What a mirror really swaps'], d: ['Зеркало — กระจก (grà-jòk, зеркало, а ещё стекло) — меняет не лево и право, а перед и зад: ваша правая рука остаётся справа. Надпись на футболке читается наоборот потому, что вы сами развернули её к стеклу.', 'A mirror — กระจก (grà-jòk, mirror, and also glass) — swaps front and back, not left and right: your right hand stays on the right. The writing on your T-shirt reads backwards because you turned it toward the glass yourself.'] },
  { c: 'phys', icon: 'coffee', t: ['Кофейное кольцо', 'The coffee ring'], d: ['Засохшая капля กาแฟ (gaa-fae, кофе) оставляет тёмное кольцо по краю: у кромки вода испаряется быстрее, и течение уносит частички туда. Про «эффект кофейного кольца» пишут в серьёзных научных журналах — он мешает, например, при печати электроники.', 'A dried drop of กาแฟ (gaa-fae, coffee) leaves a dark ring at its edge: water evaporates faster there, and the flow carries particles outward. The “coffee-ring effect” appears in serious journals — it is a nuisance in printing electronics, for example.'] },
  { c: 'phys', icon: 'waves', t: ['Откуда фонтан газировки', 'Where soda fountains come from'], d: ['Газировка — น้ำอัดลม (náam àt-lom, газировка, дословно «вода со сжатым воздухом») — пенится на шероховатостях: пузырьки CO₂ рождаются на царапинах и пылинках. Поэтому ментос даёт фонтан, а постукивание по банке перед открытием, как показали опыты, почти не помогает.', 'Soda — น้ำอัดลม (náam àt-lom, soda, literally “pressed-air water”) — foams on rough spots: CO₂ bubbles are born on scratches and specks. That is why Mentos makes a fountain, while tapping a can before opening, experiments showed, barely helps.'] },
  { c: 'body', icon: 'eye', t: ['Слепое пятно', 'Your blind spot'], d: ['В каждом ตา (taa, глаз) есть จุดบอด (jùt-bòt, слепое пятно) — место, где выходит зрительный нерв и нет рецепторов. Нарисуйте крестик и в 8 см правее точку, закройте левый глаз, смотрите правым на крестик и медленно приближайте лист: точка исчезнет. Мозг просто дорисовывает дыру.', 'Every ตา (taa, eye) has a จุดบอด (jùt-bòt, blind spot) where the optic nerve leaves and there are no receptors. Draw a cross and a dot 8 cm to its right, close your left eye, look at the cross with your right and slowly bring the paper closer: the dot vanishes. The brain simply paints over the hole.'] },
  { c: 'body', icon: 'scan-eye', t: ['Свои глаза в зеркале не движутся', 'You can’t see your own eyes move'], d: ['Подойдите к กระจก (grà-jòk, зеркало) и смотрите то в левый, то в правый свой глаз: движения вы не увидите, хотя человек рядом их видит. Во время быстрого броска взгляда мозг на долю секунды «выключает» картинку.', 'Stand at a กระจก (grà-jòk, mirror) and look from your left eye to your right one: you won’t see them move, though someone beside you will. During a quick jump of the gaze the brain switches the picture off for a split second.'] },
  { c: 'body', icon: 'clock', t: ['Остановившаяся секунда', 'The stopped second'], d: ['Бросьте взгляд на часы с секундной стрелкой: первая секунда покажется длиннее остальных. Мозг задним числом растягивает момент, когда глаз прилетел к циферблату, — это называют хроностазисом. «Часы» по-тайски — นาฬิกา (naa-lí-gaa, часы).', 'Glance at a clock with a second hand: the first second seems longer than the rest. The brain stretches the moment your eye landed on the dial after the fact — this is called chronostasis. “Clock” in Thai is นาฬิกา (naa-lí-gaa, clock).'] },
  { c: 'body', icon: 'smartphone', t: ['Двигаю головой — комната стоит', 'Shake your head, not the phone'], d: ['Читайте текст и трясите головой — буквы остаются чёткими. Теперь держите голову ровно и трясите телефоном — текст размоется. Внутреннее ухо мгновенно поворачивает глаза навстречу движению головы, а про движение телефона мозг не знает. Голова — หัว (hǔa, голова).', 'Read some text and shake your head — the letters stay sharp. Now keep your head still and shake the phone — the text blurs. Your inner ear instantly turns the eyes against head movement, but the brain knows nothing about the phone’s motion. Head is หัว (hǔa, head).'] },
  { c: 'body', icon: 'hand', t: ['Себя не защекотать', 'You can’t tickle yourself'], d: ['Самому себе не бывает จั๊กจี้ (ják-kà-jîi, щекотно): мозг заранее предсказывает ощущение от собственного движения и приглушает его. В опытах, где робот передавал движение руки с задержкой в долю секунды, щекотка возвращалась.', 'You can’t make yourself feel จั๊กจี้ (ják-kà-jîi, ticklish): the brain predicts the feeling from your own movement and dims it. In experiments where a robot passed on the hand movement with a split-second delay, the tickle came back.'] },
  { c: 'body', icon: 'fingerprint', t: ['Два носа Аристотеля', 'Aristotle’s two noses'], d: ['Скрестите указательный и средний пальцы и потрогайте ими кончик จมูก (jà-mùuk, нос): покажется, что носов два. Это описал ещё Аристотель — мозг не привык, что внешние стороны этих пальцев касаются одного предмета.', 'Cross your index and middle fingers and touch the tip of your จมูก (jà-mùuk, nose): it feels like two noses. Aristotle described it — the brain is not used to the outer sides of these fingers touching one object.'] },
  { c: 'body', icon: 'arrow-up-from-line', t: ['Рука взлетает сама', 'The floating arm'], d: ['Встаньте в дверной проём и 30 секунд изо всех сил давите тыльной стороной руки — แขน (khǎen, рука) — в косяк. Отойдите и расслабьтесь: рука сама поплывёт вверх. Это феномен Конштамма — мозг ещё немного «держит» команду.', 'Stand in a doorway and press the back of your แขน (khǎen, arm) hard against the frame for 30 seconds. Step away and relax: the arm floats up on its own. This is the Kohnstamm phenomenon — the brain keeps the command running a little longer.'] },
  { c: 'body', icon: 'contrast', t: ['Цвет-призрак', 'The ghost colour'], d: ['Смотрите 30 секунд на яркий цветной квадрат, а потом на белую стену: появится тот же квадрат в противоположном цвете — красный станет сине-зелёным. Рецепторы одного цвета устают, и другие на время «перевешивают». Цвет по-тайски — สี (sǐi, цвет).', 'Stare at a bright coloured square for 30 seconds, then at a white wall: the square appears in the opposite colour — red turns blue-green. Receptors for one colour tire and the others take over for a while. Colour in Thai is สี (sǐi, colour).'] },
  { c: 'body', icon: 'repeat', t: ['Слово теряет смысл', 'A word that loses its meaning'], d: ['Повторите вслух одно слово 30 раз подряд — например คำ (kham, слово): оно превратится в бессмысленный набор звуков. Это семантическое пресыщение — связь звука со смыслом временно «устаёт». Через минуту всё вернётся.', 'Say one word aloud 30 times in a row — say คำ (kham, word): it turns into a meaningless string of sounds. This is semantic satiation — the link between sound and meaning tires for a while. It comes back within a minute.'] },
  { c: 'body', icon: 'eye-off', t: ['Отвёл глаза — вспомнил', 'Look away to think'], d: ['Когда трудно вспомнить или ответить, люди отводят взгляд — и это правда помогает: лица и детали вокруг отнимают внимание. В опытах ответы на трудные вопросы были точнее, если человек смотрел в сторону или закрывал глаза. Думать — คิด (khít, думать).', 'When recalling something is hard, people look away — and it really helps: faces and details around us use up attention. In experiments, answers to hard questions were more accurate when people looked aside or closed their eyes. To think is คิด (khít, think).'] },
  { c: 'body', icon: 'sun', t: ['Чих от солнца', 'Sneezing at the sun'], d: ['У 18–35% людей яркий свет вызывает จาม (jaam, чихать) — это фотический чихательный рефлекс, он передаётся по наследству. Если чих «застрял», таким людям помогает выйти на свет или взглянуть на лампу. На само солнце долго не смотрите.', 'In 18–35% of people bright light triggers a จาม (jaam, sneeze) — the photic sneeze reflex, and it runs in families. If a sneeze is stuck, stepping into the light or glancing at a lamp helps them. Never stare at the sun itself.'] },
  { c: 'body', icon: 'smile', t: ['Зевота заразна', 'Yawns are contagious'], d: ['หาว (hǎao, зевать) заразно: часто достаточно прочитать о зевоте, чтобы зевнуть. Сильнее всего «заражают» близкие люди, а собаки, как показали опыты, могут зевнуть вслед за хозяином. Вы уже зевнули?', 'หาว (hǎao, yawning) is contagious: often reading about it is enough. Close people are the most “infectious”, and experiments show dogs can catch their owner’s yawn. Yawned yet?'] },
  { c: 'body', icon: 'ice-cream-cone', t: ['Мороз в мозгу', 'Brain freeze'], d: ['Острая боль во лбу от холодного ไอศกรีม (ai-sà-kriim, мороженое) — это резкое сужение и расширение сосудов нёба. Прижмите язык к нёбу или сделайте глоток тёплого — пройдёт за секунды.', 'The sharp forehead pain from cold ไอศกรีม (ai-sà-kriim, ice cream) comes from blood vessels in the palate narrowing and widening. Press your tongue to the roof of your mouth or sip something warm — it fades in seconds.'] },
  { c: 'body', icon: 'wind', t: ['Икота', 'Hiccups'], d: ['Против สะอึก (sà-ùek, икота) способов много: задержать дыхание, выдохнуть и наклонить голову, выпить воды. Все они действуют через диафрагму и блуждающий нерв, но строгих доказательств мало. В 2021 году проверили сильный вдох-глоток — пить через узкую трубочку с усилием: 92% сказали, что помогло, хотя контрольной группы не было. Икота дольше двух суток — повод к врачу.', 'For สะอึก (sà-ùek, hiccups) there are many tricks: hold your breath, breathe out and bend your head, drink water. They all act through the diaphragm and the vagus nerve, but hard evidence is thin. A 2021 study tried a forceful sip through a narrow straw: 92% said it worked, though there was no control group. Hiccups lasting over two days are a reason to see a doctor.'] },
  { c: 'body', icon: 'brain', t: ['Перезагрузка за минуту', 'A one-minute reset'], d: ['Ближе всего к «суперсознанию за минуту» — физиологический вздох: два вдоха носом подряд и долгий медленный выдох ртом. В исследовании Стэнфорда (2023) 5 минут такого дыхания в день улучшали настроение и снижали тревогу сильнее, чем медитация. Дышать — หายใจ (hǎai-jai, дышать), где ใจ — «сердце, душа».', 'The closest thing to a “one-minute superconsciousness” is the physiological sigh: two inhales through the nose, then a long slow exhale through the mouth. In a Stanford study (2023), 5 minutes a day of this breathing lifted mood and eased anxiety more than meditation. To breathe is หายใจ (hǎai-jai, breathe), and ใจ means “heart, mind”.'] },
  { c: 'lang', icon: 'landmark', t: ['Таиланд — имя для чужих', 'Thailand is a name for outsiders'], d: ['Название «Таиланд» — для иностранцев. Сами тайцы говорят ประเทศไทย (pra-thêet thai, страна тайцев) или по-домашнему เมืองไทย (mueang thai). Официально до 1939 года страна называлась Сиамом.', '“Thailand” is the name for foreigners. Thais themselves say ประเทศไทย (pra-thêet thai, land of the Thai) or, more homely, เมืองไทย (mueang thai). Until 1939 the country was officially Siam.'] },
  { c: 'lang', icon: 'building-2', t: ['Никакого «Бангкока»', 'No “Bangkok” here'], d: ['«Бангкок» — тоже название для приезжих: так звалась деревня บางกอก (baang-gòk) на месте столицы. Тайцы говорят กรุงเทพ (krung-thêep, «город ангелов»), а полное церемониальное имя города — самое длинное название города в мире по Книге рекордов Гиннесса.', '“Bangkok” is also a name for visitors: it was the village บางกอก (baang-gòk) where the capital now stands. Thais say กรุงเทพ (krung-thêep, “city of angels”), and the city’s full ceremonial name is the longest place name in the world according to Guinness.'] },
  { c: 'lang', icon: 'type', t: ['Без пробелов', 'No spaces'], d: ['В тайском письме нет пробелов между словами: ฉันรักเมืองไทย (chǎn rák mueang thai, я люблю Таиланд) пишется слитно. Пробел ставят там, где у нас стоит точка или запятая.', 'Thai has no spaces between words: ฉันรักเมืองไทย (chǎn rák mueang thai, I love Thailand) is written as one block. A space goes where we would put a full stop or a comma.'] },
  { c: 'lang', icon: 'laugh', t: ['Смех цифрами', 'Laughing in numbers'], d: ['В переписке тайцы смеются цифрами: 555 читается «ха-ха-ха», потому что пять — ห้า (hâa, пять). Чем смешнее, тем длиннее: 55555555.', 'In chats Thais laugh with numbers: 555 reads “ha-ha-ha” because five is ห้า (hâa, five). The funnier it is, the longer it gets: 55555555.'] },
  { c: 'lang', icon: 'calendar', t: ['На 543 года впереди', '543 years ahead'], d: ['Тайский календарь опережает наш на 543 года: 2026 год — это 2569 год буддийской эры, พ.ศ. (phɔɔ-sɔ̌ɔ, буддийская эра). Такие даты стоят в документах, на чеках и в сроках годности.', 'The Thai calendar runs 543 years ahead: 2026 is year 2569 of the Buddhist era, พ.ศ. (phɔɔ-sɔ̌ɔ, Buddhist era). You will see these dates on documents, receipts and expiry labels.'] },
  { c: 'lang', icon: 'cherry', t: ['Иностранец и гуава', 'Foreigner and guava'], d: ['ฝรั่ง (fà-ràng) значит и «иностранец-европеец», и «гуава». Слово, вероятно, пришло от «франков» — так на Востоке когда-то называли всех европейцев.', 'ฝรั่ง (fà-ràng) means both “Western foreigner” and “guava”. The word probably comes from “Franks”, the old Eastern name for all Europeans.'] },
  { c: 'lang', icon: 'message-circle', t: ['Молодое «здравствуйте»', 'A young “hello”'], d: ['Слово สวัสดี (sà-wàt-dii, здравствуйте) совсем молодое: его ввели в 1930-х годах как вежливое приветствие, взяв санскритское «свасти» — «благополучие». До этого здоровались вопросами вроде กินข้าวยัง (gin khâao yang, поел уже?).', 'สวัสดี (sà-wàt-dii, hello) is a young word: it was introduced in the 1930s as a polite greeting, built on Sanskrit “svasti”, well-being. Before that people greeted with questions like กินข้าวยัง (gin khâao yang, eaten yet?).'] },
  { c: 'lang', icon: 'hash', t: ['44 буквы на 21 звук', '44 letters for 21 sounds'], d: ['В тайском алфавите 44 согласные, а разных согласных звуков около 21. Лишние буквы нужны для слов из пали и санскрита — и для тонов: от класса согласной зависит, как звучит слог.', 'The Thai alphabet has 44 consonants but only about 21 consonant sounds. The spares serve words from Pali and Sanskrit — and the tones: a consonant’s class decides how the syllable sounds.'] },
  { c: 'lang', icon: 'heart', t: ['Креветка, пиво и гольф', 'Shrimp, beer and golf'], d: ['Почти у каждого тайца есть ชื่อเล่น (chûue-lên, домашнее имя) — короткое и часто забавное: กุ้ง (gûng, креветка), เบียร์ (bia, пиво), กอล์ฟ (góf, гольф). Длинные официальные имена живут в основном в документах.', 'Almost every Thai has a ชื่อเล่น (chûue-lên, nickname) — short and often funny: กุ้ง (gûng, shrimp), เบียร์ (bia, beer), กอล์ฟ (góf, golf). Long official names live mostly in documents.'] },
  { c: 'lang', icon: 'spell-check', t: ['«Р» звучит как «л»', 'R that sounds like L'], d: ['В разговоре тайцы часто произносят ร как «л»: ร้อน (rɔ́ɔn, жарко) звучит как «лон». Чёткое «р» считается красивым и вежливым — его слышно в новостях и на сцене.', 'In everyday speech Thais often say ร as “l”: ร้อน (rɔ́ɔn, hot) sounds like “lon”. A crisp “r” counts as beautiful and polite — you hear it on the news and on stage.'] },
  { c: 'lang', icon: 'book-a', t: ['Буквы короля Рамакхамхаенга', 'King Ramkhamhaeng’s letters'], d: ['По традиции тайское письмо создал король Рамакхамхаенг в 1283 году — так сказано на знаменитой каменной стеле. Учёные до сих пор спорят о её подлинности, но ЮНЕСКО внесла надпись в реестр «Память мира».', 'By tradition King Ramkhamhaeng created the Thai script in 1283, as a famous stone inscription says. Scholars still argue about its authenticity, but UNESCO added it to the Memory of the World register.'] },
  { c: 'lang', icon: 'smile', t: ['Философия в трёх словах', 'A philosophy in three words'], d: ['ไม่เป็นไร (mâi bpen rai, ничего страшного) — почти национальная философия: так отвечают на «спасибо», на «извините» и когда что-то пошло не так. Не переживай, всё в порядке.', 'ไม่เป็นไร (mâi bpen rai, never mind) is almost a national philosophy: the answer to “thank you”, to “sorry” and to anything that goes wrong. Don’t worry, it’s fine.'] },
  { c: 'lang', icon: 'flower-2', t: ['«Свободные» люди', 'The “free” people'], d: ['Слово ไทย (thai, тайский) часто толкуют как «свободный», и тайцы любят напоминать, что их страна никогда не была колонией европейцев. Учёные считают это толкование поздним, но оно прочно вошло в национальную гордость.', 'The word ไทย (thai, Thai) is often explained as “free”, and Thais like to recall that their country was never a European colony. Scholars see this reading as a later one, but it is firmly part of national pride.'] },
];

// paragraphs [ru, en] with some phrases in Thai (tappable, voiced like the facts)
const STORIES = [{
  id: 'na-mesto', year: 2004, site: 'https://lleo.me/', url: 'https://lleo.me/arhive/fan2004/na_mesto.shtml',
  author: { ru: 'Леонид Каганов', en: 'Leonid Kaganov' }, title: { ru: 'На место', en: 'Back in Place', th: 'กลับเข้าที่' },
  paras: [
    ['— Ничто не предвещало беды. Конец จักรวาล (jàk-grà-waan, Вселенной) подкрался незаметно, — начал กัปตัน (gàp-dtan, Капитан), оглядев соплеменников-кремнозоев. — Ученые первыми зафиксировали бурное изменение спектра, а вскоре каждому стало ясно, что ดวงอาทิตย์ (duang-aa-thít, Светило) стремительно угасает. По всей нашей планете прокатились волны небывалых бурь и катаклизмов, уничтожая все живое и заставляя разумных обитателей прятаться в наспех вырытых подземных убежищах. То же самое происходило и с другими звездами. Галактика стремительно сжималась, чтобы вновь взорваться миллионами светил. И тогда в рекордно короткие сроки был построен ยาน (yaan, Корабль) — временное пристанище последних обитателей. Корабль стремительно вышел за пределы Галактики. Мы надеялись вернуться после Большого взрыва и поселиться на подходящей планете...', '“Nothing foretold disaster. The end of the จักรวาล (jàk-grà-waan, Universe) crept up unnoticed,” the กัปตัน (gàp-dtan, Captain) began, looking round at his fellow Silicozoans. “The scientists were the first to register a violent shift in the spectrum, and soon it was clear to everyone that our ดวงอาทิตย์ (duang-aa-thít, Star) was rapidly going out. Waves of unheard-of storms and cataclysms swept across our whole planet, wiping out every living thing and driving the intelligent inhabitants into hastily dug underground shelters. The same was happening to the other stars. The Galaxy was rapidly collapsing, only to explode again into millions of suns. And so, in record time, the ยาน (yaan, Ship) was built — a temporary refuge for the last inhabitants. The Ship swiftly left the Galaxy behind. We hoped to return after the Big Bang and settle on a suitable planet…”'],
    ['Капитан умолк и вновь оглядел собравшихся в рубке: кремнозои задумчиво кивали выпуклыми головами. Мы все равно никогда не узнаем, что именно говорил Капитан и как все было на самом деле, так что простим ему этот пафосный всплеск красноречия, который помог нам, ผู้อ่าน (phûu-àan, читателям), слегка войти в курс дела без лишних предисловий.', 'The Captain fell silent and again looked round at those gathered on the bridge: the Silicozoans nodded their bulging heads thoughtfully. We will never know exactly what the Captain said or how it all really was, so let us forgive him this burst of grandiloquence, which helped us ผู้อ่าน (phûu-àan, readers) get the picture without lengthy introductions.'],
    ['— Напомню... — поднялся корабельный หมอ (mǒr, Врач), тоже ни к кому конкретно не обращаясь, кроме читателя. — Мы, кремнозои — единственная в мире разумная раса. Для существования нам необходима спокойная планета, где присутствует углекислота и активированный кремний, который мы กิน (gin, употребляем в пищу).', '“Let me remind you…” the ship’s หมอ (mǒr, Doctor) rose, likewise addressing no one in particular except the reader. “We Silicozoans are the only intelligent race in the world. To exist, we need a quiet planet with carbon dioxide and activated silicon, which we กิน (gin, eat).”'],
    ['— ขอพูดบ้างได้ไหม (khǒr phûut bâang dâai mǎi, Можно я тоже скажу?) — поднялась молодая потомственная Нанотехнолог. — Формировать пригодную планету нам пришлось самим. Для этого в лаборатории Корабля под руководством моего พ่อ (phôr, отца) были созданы наноботы — крошечные молекулярные механизмы, собранные из экологически чистых углеродных деталей. Это не просто механика, это, господа кремнозои, — невиданная молекулярная механика! Наноботы умели поглощать แสง (sǎeng, свет), вырабатывать углекислый газ и бесконечно воспроизводить самих себя. Две капсулы с культурой наноботов были отправлены вперед нас со сверхсветовой скоростью — они должны были выбрать среди мусора новорожденной галактики две планеты с подходящим климатом и рассеять там культуру роботов, чтобы к нашему приближению была готова подходящая атмосфера.', '“ขอพูดบ้างได้ไหม (khǒr phûut bâang dâai mǎi, May I say something too?)” rose the young Nanotechnologist, the latest of a family of nanotechnologists. “We had to shape a suitable planet ourselves. For that, the Ship’s laboratory, under my พ่อ (phôr, father’s) direction, created nanobots — tiny molecular machines assembled from environmentally clean carbon parts. This is not mere mechanics, gentlemen Silicozoans — this is molecular mechanics such as the world has never seen! The nanobots could absorb แสง (sǎeng, light), produce carbon dioxide and reproduce themselves endlessly. Two capsules of nanobot culture were sent ahead of us at faster-than-light speed: they were to pick two planets with a suitable climate among the debris of the newborn galaxy and scatter the robot culture there, so that a suitable atmosphere would be ready by the time we arrived.”'],
    ['Нанотехнолог испуганно смолкла и оглянулась на читателя — не начал ли тот раньше времени догадываться, в чем дело? เดา (dao, Догадки) читателя прервал Капитан.', 'The Nanotechnologist fell silent in alarm and glanced at the reader: had he started guessing what was going on too early? The Captain cut the reader’s เดา (dao, guesses) short.'],
    ['— พอแล้ว (phor láew, Хватит) предисловий! — сурово заявил он. — Давайте вспомним, для чего собрались в рубке мы, высшие чины Корабля. Нанотехнолог, изложите ситуацию!', '“พอแล้ว (phor láew, Enough) introductions!” he declared sternly. “Let us recall why we, the senior officers of the Ship, have gathered on the bridge. Nanotechnologist, report the situation!”'],
    ['Капитан повернулся и включил большой проекционный экран — в центре сияла небольшая ดาว (daao, звезда), а вокруг нее быстро вращались планеты. Нанотехнолог снова встала и огляделась.', 'The Captain turned and switched on the big projection screen: a small ดาว (daao, star) shone in the centre, with planets spinning quickly around it. The Nanotechnologist stood up again and looked around.'],
    ['— Первая из капсул выбрала третью планету этой звезды — у планеты была подходящая гравитация и อุณหภูมิ (un-hà-phuum, температура). Кремния на ней также хватало в избытке. Не было лишь углекислой атмосферы для жизненно важных процессов. И к нашему приближению наноботы сделали свое дело — приборы показывают вполне подходящий процент углекислоты в атмосфере. Сейчас мы висим около звездной системы и พร้อม (phrɔ́ɔm, готовы) к высадке...', '“The first capsule chose the third planet of this star: it had suitable gravity and อุณหภูมิ (un-hà-phuum, temperature). There was plenty of silicon on it, too. The only thing missing was a carbon-dioxide atmosphere for our vital processes. And by the time we approached, the nanobots had done their job — the instruments show a perfectly suitable share of carbon dioxide in the atmosphere. Now we are hanging near the star system, พร้อม (phrɔ́ɔm, ready) to land…”'],
    ['— มีปัญหาอะไร (mii bpan-hǎa à-rai, В чем же проблема?) — поинтересовался Штурман.', '“มีปัญหาอะไร (mii bpan-hǎa à-rai, So what is the problem?)” asked the Navigator.'],
    ['— Проблема... — Нанотехнолог вздохнула. — Пусть лучше начнет Физик!', '“The problem…” The Nanotechnologist sighed. “Better let the Physicist begin!”'],
    ['— Проблема в том, — заговорил невысокий плотный Физик, — что когда мы приблизились, стало заметно: поверхность планеты неоднородна. Она покрыта не кремнием, а странной углеродной накипью. Судя по спектру, это слой размножившихся наноботов. Как выразился один мой ученик, หิน (hǐn, камушек) зацвел...', '“The problem is,” began the short, stocky Physicist, “that as we came closer it became clear the planet’s surface is not uniform. It is covered not with silicon but with a strange carbon scum. Judging by the spectrum, it is a layer of nanobots that have multiplied. As one of my students put it, the หิน (hǐn, pebble) has gone into bloom…”'],
    ['— Они активно излучают ความร้อน (khwaam-rɔ́ɔn, тепловую энергию)! — взволнованно перебил Астроном. — Мы сделали снимки: эта планета заселена роботами ยักษ์ (yák, гигантского) размера! Некоторые торчат по всей планете и впитывают свет, остальные — видимо это их เมล็ด (má-lét, семена) — носятся повсюду с немыслимыми скоростями и бороздят грунт!', '“They are actively radiating ความร้อน (khwaam-rɔ́ɔn, heat)!” the Astronomer broke in excitedly. “We took pictures: this planet is populated by ยักษ์ (yák, giant) robots! Some stick up all over the planet soaking up light, and the rest — apparently their เมล็ด (má-lét, seeds) — rush about everywhere at unthinkable speeds, ploughing the ground!”'],
    ['— В чем же проблема? — спросил Старейшина. — Мы же и планировали засеять планету наноботами?', '“So what is the problem?” asked the Elder. “Didn’t we plan to seed the planet with nanobots in the first place?”'],
    ['— หุ่นยนต์ (hùn-yon, Роботы) не просто размножились, — вздохнула Нанотехнолог. — Они злокачественно мутировали, видимо под действием звездного излучения, которое мы не учли. Наши зонды показывают: сейчас на планете миллионы модификаций наноботов. Безусловно, все они сохранили свои изначальные свойства: у них мизерные размеры, крохотный срок жизни и размножаются они тем же самым дублированием, которое разработал мой отец. Но мутировавшие боты научились слипаться! И сейчас вся планета, — она указала на обзорный экран, — кишит углеродными глыбами из миллиардов сцепленных наноботов! Эти глыбы ростом с нас и даже больше! И хотя они существуют всего лишь по несколько десятков секунд, но передвигаются с немыслимыми скоростями и активно деформируют любую материю! Высаживаться туда сейчас — บ้า (bâa, безумие).', '“The หุ่นยนต์ (hùn-yon, robots) have not just multiplied,” sighed the Nanotechnologist. “They have mutated malignantly, apparently under the star’s radiation, which we did not take into account. Our probes show millions of nanobot variants on the planet now. Of course, they have all kept their original properties: they are minuscule, they live for a tiny span, and they reproduce by the same duplication my father designed. But the mutated bots have learned to stick together! And now the whole planet,” she pointed at the viewscreen, “is swarming with carbon lumps made of billions of linked nanobots! These lumps are as tall as we are, even taller! And although each one exists for only a few dozen seconds, they move at unthinkable speeds and actively deform any matter! Landing there now would be บ้า (bâa, madness).”'],
    ['— Как обстоит дело со второй планетой? — сухо спросил Старейшина.', '“And how do things stand with the second planet?” the Elder asked drily.'],
    ['— Пока нет точных данных, — пояснил Капитан. — Вторая планета в другой звездной системе, вне досягаемости зондов Корабля. Вопрос в том, что нам делать с этой? ความเห็น (khwaam-hěn, Мнения) разделились. Я для того и созвал Совет, чтобы нам решить проблему. В принципе, атмосфера готова, и я предлагаю просто...', '“No exact data yet,” the Captain explained. “The second planet is in another star system, out of reach of the Ship’s probes. The question is what to do with this one. ความเห็น (khwaam-hěn, Opinions) are divided. That is why I called the Council — to settle the problem. In principle, the atmosphere is ready, and I propose we simply…”'],
    ['— ไม่! (mâi, Нет!) — вскинулась Нанотехнолог. — Это уникальный эксперимент! Мы обязаны сперва изучить мутацию наноботов! Капитан ничего не понимает!', '“ไม่! (mâi, No!)” the Nanotechnologist flared up. “This is a unique experiment! We must study the nanobots’ mutation first! The Captain understands nothing!”'],
    ['Капитан โกรธ (gròht, разъярился), повернулся к обзорному экрану и выждал несколько секунд, сосчитав в уме, пока третья планета сделает ровно десять оборотов вокруг звезды. Затем он повернулся к собранию, уже немного успокоившись.', 'The Captain โกรธ (gròht, flew into a rage), turned to the viewscreen and waited a few seconds, counting in his head while the third planet made exactly ten revolutions around its star. Then he turned back to the assembly, a little calmer.'],
    ['— Повторяю, — сказал он угрюмо, — колония наноботов вышла из-под контроля и представляет серьезную อันตราย (an-dtà-raai, опасность). Я предлагаю для начала стерилизовать поверхность планеты и направиться к запасной. Если и там...', '“I repeat,” he said grimly, “the nanobot colony is out of control and poses a serious อันตราย (an-dtà-raai, danger). I propose that we first sterilise the planet’s surface and then head for the reserve one. If there, too…”'],
    ['— Капитан! — перебила Нанотехнолог. — За последние часы структура поверхности усложнилась в нарастающем темпе! Самые последние наблюдения говорят о появлении сложных сооружений, которые можно объяснить лишь направленной деятельностью наноботов! А по самым последним сводкам, от планеты начало исходить คลื่นวิทยุ (khlûuen wít-thá-yú, радиоизлучение) во всех диапазонах, оно с каждой секундой множится. Это похоже на стремительно нарастающую эволюцию разума...', '“Captain!” the Nanotechnologist interrupted. “Over the last few hours the structure of the surface has grown more complex at an accelerating pace! The latest observations show complex constructions that can only be explained by purposeful activity of the nanobots! And according to the very latest reports, the planet has begun emitting คลื่นวิทยุ (khlûuen wít-thá-yú, radio waves) across every band, and they multiply by the second. It looks like a rapidly accelerating evolution of intelligence…”'],
    ['— ปัญญา (bpan-yaa, Разум)? — резко обернулся Капитан. — Микроскопический нанобот может обладать разумом?', '“ปัญญา (bpan-yaa, Intelligence)?” The Captain spun round. “A microscopic nanobot can be intelligent?”'],
    ['— Один — нет, — серьезно ответила Нанотехнолог. — Но я не исключаю возможности, что разумным может стать их миллионный конгломерат. И если это разум... то мы, кремнозои, отныне ไม่โดดเดี่ยว (mâi dòot-dìao, не одиноки) во Вселенной! Мы можем вступить в контакт и...', '“One cannot,” the Nanotechnologist replied seriously. “But I do not rule out that a conglomerate of a million of them could become intelligent. And if it is intelligence… then we Silicozoans are no longer ไม่โดดเดี่ยว (mâi dòot-dìao, alone) in the Universe! We could make contact and…”'],
    ['— Как вы себе представляете контакт? — возмутился Капитан. — Ведь жизнь углеродных наноботов от рождения до смерти исчисляется десятками секунд, ведь так? О чем успеет подумать разум за วินาที (wí-naa-thii, секунду)?', '“And how do you picture contact?” the Captain exclaimed. “The life of a carbon nanobot from birth to death lasts a few dozen seconds, doesn’t it? What can a mind manage to think in a วินาที (wí-naa-thii, second)?”'],
    ['— Что мы знаем о них? — возразила Нанотехнолог. — Быть может, у них свои секунды?', '“What do we know about them?” the Nanotechnologist objected. “Perhaps they have seconds of their own?”'],
    ['— Уничтожить и только уничтожить! — заявил Капитан. — Какой толк от разума, живущего секунды? Секундой больше, секундой меньше — не вижу принципиальной разницы! Оборвать поток несчастных наножизней — это просто акт ความเมตตา (khwaam-mêt-dtaa, милосердия).', '“Destroy them, and only destroy!” the Captain declared. “What use is a mind that lives for seconds? A second more, a second less — I see no fundamental difference! Cutting short the flow of these wretched nano-lives is simply an act of ความเมตตา (khwaam-mêt-dtaa, mercy).”'],
    ['— Капитан! — вскинулась Нанотехнолог.', '“Captain!” the Nanotechnologist cried out.'],
    ['— И акт ความปลอดภัย (khwaam-bplɔ̀ɔt-phai, безопасности)! — жестко сказал Капитан. — Если это разум, и если он развивается с такой немыслимой быстротой, что вы будете делать, если они атакуют нас уже в космосе?', '“And an act of ความปลอดภัย (khwaam-bplɔ̀ɔt-phai, safety)!” the Captain said harshly. “If this is intelligence, and if it develops at such unthinkable speed, what will you do when they attack us right here in space?”'],
    ['— Разумное существо никогда не причинит вреда другому разумному... — неуверенно парировала Нанотехнолог.', '“An intelligent being will never harm another intelligent being…” the Nanotechnologist countered uncertainly.'],
    ['Повисла зловещая ความเงียบ (khwaam-ngîap, тишина). Старейшина привстал и хотел было что-то сказать, но тут в рубку влетел запыхавшийся Стрелок и завопил с порога:', 'An ominous ความเงียบ (khwaam-ngîap, silence) fell. The Elder half rose, about to say something, but just then the Gunner burst onto the bridge, out of breath, and yelled from the doorway:'],
    ['— Пару! สองนาที (sɔ̌ɔng naa-thii, Пару минут) назад с третьей планеты вылетел искусственный объект! Он приземлился на четвертую и носится по ней с дикой скоростью!', '“A couple! สองนาที (sɔ̌ɔng naa-thii, A couple of minutes) ago an artificial object took off from the third planet! It has landed on the fourth and is racing around it at a wild speed!”'],
    ['Поднялся шум, но капитан среагировал первым.', 'An uproar broke out, but the Captain reacted first.'],
    ['— ทุกคนเตรียมพร้อม (thúk khon dtriam phrɔ́ɔm, Всем приготовиться!) — заорал он. — Стрелок, Штурман — на место! Залп по третьей планете из всех метеоритных пушек! Затем включить форсаж, и уводим Кораб...', '“ทุกคนเตรียมพร้อม (thúk khon dtriam phrɔ́ɔm, Everyone stand by!)” he roared. “Gunner, Navigator — to your places! A salvo at the third planet from every meteor cannon! Then full thrust, and we take the Shi…”'],
    ['Закончить он не успел: рубка перевернулась, пространство вдруг бросилось кувырком и налетел калейдоскоп мельтешащих пятен. А в следующую секунду Капитану уже отпиливали หัว (hǔa, голову) «болгаркой» в Зеленоградской лаборатории НИИ Космоса при АН России.', 'He did not get to finish: the bridge turned over, space suddenly went head over heels, and a kaleidoscope of flickering spots came rushing in. And the very next second, the Captain’s หัว (hǔa, head) was already being sawn off with an angle grinder in the Zelenograd laboratory of the Space Research Institute of the Russian Academy of Sciences.'],
    ['Когда экипаж американского «Дискавери-108" обнаружил за орбитой Плутона неопознанный объект искусственного происхождения, это поначалу стало самой громкой сенсацией XXI века. Но поднятая журналистами шумиха не оправдалась: инопланетного разума так и не нашли. Удивительный корабль อำพัน (am-phan, янтарного) цвета не отвечал на сигналы, а внутри оказался ว่างเปล่า (wâang-bplàao, пуст). В его помещениях лишь стояли разбросанные окаменевшие глыбы из кристаллов оксида кремния. Всего таких тумбочек насчитали более восьми сотен. Их назвали Странниками — за странную форму и состав.', 'When the crew of the American Discovery-108 found an unidentified object of artificial origin beyond the orbit of Pluto, it was at first the loudest sensation of the twenty-first century. But the hype stirred up by journalists did not pay off: no alien intelligence was ever found. The astonishing อำพัน (am-phan, amber)-coloured ship did not answer signals and turned out to be ว่างเปล่า (wâang-bplàao, empty) inside. Its rooms held only scattered, petrified lumps of silicon-oxide crystals. More than eight hundred of these nightstand-like blocks were counted in all. They were named the Strangers, for their strange shape and composition.'],
    ['Возраст корабля ученые оценили в десятки миллиардов лет, но так и не смогли выяснить, кто его создал, как он управлялся и из какой галактики летел все это время. Корабль отбуксировали на Землю — сейчас он стоит в районе Большого Каньона и открыт для экскурсий по четным дням. Странников и прочее оборудование корабля распределили по музеям и лабораториям мира. Поначалу считалось, что Странники — это слипшаяся в глыбы вековая корабельная пыль. Затем выяснилось, что внутри они имеют сложную кристаллическую структуру, в которой год за годом теплятся вялые окислительные процессы. Ученые еще долго спорили о предназначении этих устройств на корабле без экипажа, а писатели высказывали самые фантастические догадки. Но когда на одной из планет сектора Гончих Псов обнаружилась самая настоящая братская цивилизация разумных белковых — про корабль и Странников мигом ลืม (luem, забыли).', 'Scientists put the ship’s age at tens of billions of years, but never found out who had built it, how it was steered or from which galaxy it had been flying all this time. The ship was towed to Earth; it now stands near the Grand Canyon and is open to visitors on even-numbered days. The Strangers and the rest of the ship’s equipment were distributed among the world’s museums and laboratories. At first the Strangers were thought to be age-old ship’s dust caked into lumps. Then it turned out that inside they had a complex crystalline structure in which sluggish oxidation processes smouldered year after year. Scientists argued for a long time about the purpose of these devices on a ship without a crew, and writers put forward the most fantastic guesses. But when a genuine sister civilisation of intelligent protein beings was discovered on a planet in the Canes Venatici sector, the ship and the Strangers were ลืม (luem, forgotten) in an instant.'],
    ['Лишь старые экскурсоводы Эстонского национального พิพิธภัณฑ์ (phí-phít-thá-phan, музея) рассказывают, будто загадочная кремниевая тумбочка месяц за месяцем чуть меняет свою форму и по миллиметру двигается к краю стенда. Каждые полгода приходится ставить ее กลับเข้าที่ (glàp khâo thîi, на место).', 'Only the old guides of the Estonian National พิพิธภัณฑ์ (phí-phít-thá-phan, Museum) say that the mysterious silicon nightstand changes its shape a little, month after month, and creeps a millimetre at a time towards the edge of its stand. Every six months they have to put it กลับเข้าที่ (glàp khâo thîi, back in place).'],
    ['апрель 2004, Москва', 'April 2004, Moscow'],
  ],
}];

/* ================= SPEECH ================= */
// Pre-generated neural voice files: audio/<m|f>/<fnv1a(text)>.mp3 (see tools/gen_audio.py).
// Falls back to the browser's speechSynthesis when a file is missing.
const fnv = str => { let h = 0x811c9dc5; for (const b of new TextEncoder().encode(str)) { h ^= b; h = Math.imul(h, 0x01000193) >>> 0 } return h.toString(16).padStart(8, '0') };
const player = new Audio();
let thVoice = null, warned = false, playId = 0;
const hasTTS = 'speechSynthesis' in window;
function loadVoices() { thVoice = speechSynthesis.getVoices().find(v => /^th/i.test(v.lang)) || null }
if (hasTTS) { loadVoices(); speechSynthesis.onvoiceschanged = loadVoices }
function ttsFallback(text, done) {
  if (!hasTTS || (!thVoice && !warned)) { warned = true; toast(t('noVoice')) }
  if (!hasTTS) return done();
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'th-TH'; u.rate = .75;
  if (thVoice) u.voice = thVoice;
  u.onend = u.onerror = done;
  speechSynthesis.speak(u);
}
// text may be "part|part|part" — played back to back (used by the number builder).
// voice: 'm' | 'f' overrides the He/She switch (lines spoken by Thais); onEnd fires when playback finishes.
const audioUrl = (text, voice) => `audio/${voice || gender}/${fnv(text)}.mp3`;
// Preloading: files are fetched ahead (hover / touch / focus, visible sections, the next trainer item)
// and kept as blob URLs, so a click plays straight from memory.
const audioReady = new Map(), audioLoading = new Map();
function loadAudio(url) {
  if (audioReady.has(url)) return Promise.resolve();
  if (!audioLoading.has(url)) audioLoading.set(url, fetch(url)
    .then(r => r.ok ? r.blob() : null).then(b => { if (b) audioReady.set(url, URL.createObjectURL(b)) })
    .catch(() => {}).finally(() => audioLoading.delete(url)));
  return audioLoading.get(url);
}
const urlsOf = (text, voice) => String(text).split('|').map(p => audioUrl(p, voice));
const preload = (text, voice) => text && urlsOf(text, voice).forEach(loadAudio);
// background preloading goes through a small queue so it never blocks what the user clicks
const bgQueue = []; let bgActive = 0;
function preloadIdle(text, voice) { bgQueue.push(...urlsOf(text, voice)); pumpBg() }
function pumpBg() {
  while (bgActive < 3 && bgQueue.length) {
    const url = bgQueue.shift();
    if (audioReady.has(url) || audioLoading.has(url)) continue;
    bgActive++; loadAudio(url).finally(() => { bgActive--; pumpBg() });
  }
}
function speak(text, btn, voice, onEnd) {
  const id = ++playId, parts = text.split('|');
  preload(text, voice);
  player.pause(); if (hasTTS) speechSynthesis.cancel();
  $$('.speaking').forEach(b => b.classList.remove('speaking'));
  btn?.classList.add('speaking');
  const done = () => { if (id === playId) { btn?.classList.remove('speaking'); onEnd?.() } };
  let i = 0;
  const next = () => {
    if (id !== playId) return;
    if (i >= parts.length) return done();
    const url = audioUrl(parts[i++], voice);
    player.src = audioReady.get(url) || url;
    player.play().catch(() => {});
  };
  player.onended = next;
  player.onerror = () => { if (id === playId) ttsFallback(parts.join(''), done) };
  next();
}
let toastTimer;
function toast(msg) {
  $('#toastText').textContent = msg;
  $('#toast').classList.remove('opacity-0');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => $('#toast').classList.add('opacity-0'), 4500);
}
const warmAudio = e => { const b = e.target.closest?.('[data-say]'); if (b?.dataset.say) preload(b.dataset.say, b.dataset.voice) };
document.addEventListener('pointerover', warmAudio, { passive: true });
document.addEventListener('touchstart', warmAudio, { passive: true });
document.addEventListener('focusin', warmAudio);
document.addEventListener('click', e => {
  const b = e.target.closest('[data-say]');
  if (b) { e.stopPropagation(); player.defaultPlaybackRate = player.playbackRate = +(b.dataset.rate || 1); speak(b.dataset.say, b, b.dataset.voice) }
});
// Thai words inside notes and tips become tappable: only text that mixes Thai with Latin/Cyrillic,
// so phrase cards (pure Thai) and buttons keep their own behaviour
const SAY_RUN = /[\u0E00-\u0E7F]+(?: [\u0E00-\u0E7F]+)*/g, SAY_HAS = /[\u0E00-\u0E7F]/, SAY_OTHER = /[a-zA-Zа-яА-ЯёЁ]/, SAY_OK = () => true;
function sayThai(root) {
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT), nodes = [];
  while (w.nextNode()) {
    const n = w.currentNode, v = n.nodeValue;
    if (SAY_HAS.test(v) && SAY_OTHER.test(v) && !n.parentElement.closest('button, a, [data-say], [data-nosay], .font-mono, script, style, textarea, input')) nodes.push(n);
  }
  nodes.forEach(n => {
    const f = document.createDocumentFragment(); let last = 0;
    n.nodeValue.replace(SAY_RUN, (m, i) => {
      if (!SAY_OK(m)) return;
      f.append(n.nodeValue.slice(last, i));
      const s = document.createElement('span');
      s.className = 'say-th'; s.dataset.say = m; s.textContent = m;
      f.append(s); last = i + m.length;
    });
    f.append(n.nodeValue.slice(last));
    n.replaceWith(f);
  });
}
let sayQueued = false;
new MutationObserver(() => {
  if (!sayQueued) { sayQueued = true; requestAnimationFrame(() => { sayQueued = false; sayThai(document.body) }) }
}).observe(document.body, { childList: true, subtree: true, characterData: true });

function renderDlg() {

  $('#sceneTabs').innerHTML = SCENES.map((x, i) => `<button data-scene="${i}" class="${chip(i === dlg.s)}"><i data-lucide="${x.icon}" class="w-3.5 h-3.5"></i>${x[lang]}</button>`).join('');

      <i data-lucide="party-popper" class="w-8 h-8 mx-auto text-emerald-400"></i><p class="mt-3 font-bold text-white">${t('dlgDone')}</p>
      <button data-scene="${(dlg.s + 1) % SCENES.length}" class="mt-4 inline-flex items-center gap-2 rounded-xl bg-accent px-4 py-2.5 text-sm font-semibold text-ink-950 hover:brightness-110 transition">${t('dlgNext')}<i data-lucide="arrow-right" class="w-4 h-4"></i></button></div>`;
    return;
  }
  if (dlg.wait) { $('#dlgOpts').innerHTML = `<div class="flex justify-start gap-1.5 pl-10 py-3">${[0, 1, 2].map(i => `<span class="w-2 h-2 rounded-full bg-zinc-600 animate-pulse" style="animation-delay:${i * 150}ms"></span>`).join('')}</div>`; return }
  const opts = sc.steps[dlg.step].you, nextStep = sc.steps[dlg.step + 1];

  $('#dlgOpts').innerHTML = `<p class="text-xs uppercase tracking-widest text-zinc-500">${t('dlgYou')}</p>` + dlg.order.map(i => { const o = opts[i]; return `

      <span class="block text-sm text-zinc-400">${o[lang]}</span></button>` }).join('');
}
function dlgTheirTurn(token) {
  if (token !== dlg.token || !dlg.wait) return;
  const st = SCENES[dlg.s].steps[dlg.step];
  dlg.wait = false;
  dlg.log.push({ who: 'them', ...st.them });
  dlg.order = shuffle(st.you.map((_, k) => k));
  renderDlg(); icons();
  speak(st.them.th, null, st.them.v);
}
$('#dlgOpts').addEventListener('click', e => {
  const b = e.target.closest('[data-opt]');
  if (!b) return;
  const o = SCENES[dlg.s].steps[dlg.step].you[+b.dataset.opt];
  if (!o.ok) { b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake', '!border-rose-400'); $('#dlgWhy').textContent = L(...o.why); return }
  $('#dlgWhy').textContent = '';
  dlg.log.push({ who: 'you', ...o });
  dlg.step++;
  const token = ++dlg.token;
  if (dlg.step >= SCENES[dlg.s].steps.length) { dlg.done = true; speak(dlgYouSay(o), null, dlgYouV()); renderDlg(); icons(); return }
  dlg.wait = true;
  renderDlg(); icons();
  // their reply comes after your line finishes (or after 5s if audio is interrupted)
  speak(dlgYouSay(o), null, dlgYouV(), () => setTimeout(() => dlgTheirTurn(token), 350));
  setTimeout(() => dlgTheirTurn(token), 5000);
});

const q = { score: 0, total: 0, streak: 0, cur: 0, opts: [], lock: false };
function qNext() {
  const n = items().length;
  q.cur = Math.random() * n | 0;
  q.opts = shuffle([q.cur, ...shuffle([...Array(n).keys()].filter(i => i !== q.cur)).slice(0, 3)]);
  q.lock = false;
  qRender();
}
function qRender() {
  const x = items()[q.cur];
  $('#qPrompt').innerHTML = `<div class="fade-up">
    <p class="text-sm text-zinc-500">${t('quizQ')}</p>

  $('#qOpts').innerHTML = q.opts.map(i => `<button data-q="${i}" class="fade-up rounded-xl border border-white/10 bg-ink-900 px-5 py-4 text-left font-medium hover:border-white/30 transition">${items()[i][lang]}</button>`).join('');

$('#qOpts').addEventListener('click', e => {

  if (!b || q.lock) return;
  q.lock = true; q.total++;
  const ok = +b.dataset.q === q.cur;
  ok ? (q.score++, q.streak++) : (q.streak = 0);
  $$('[data-q]').forEach(el => {
    if (+el.dataset.q === q.cur) el.className += ' !border-emerald-400 !bg-emerald-400/10 text-emerald-300 pop';

  });
  $('#qScore').textContent = q.score; $('#qTotal').textContent = q.total; $('#qStreak').textContent = q.streak;
  setTimeout(qNext, ok ? 900 : 1600);
});

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

function simil(a, b) {
  a = normTh(a); b = normTh(b);
  if (!a || !b) return 0;

    const cur = [i];
    for (let j = 1; j <= b.length; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));

$('#spCheck').onclick = () => {
  if (!SR || spk.listening) return;
  const r = new SR();
  r.lang = 'th-TH'; r.interimResults = false; r.maxAlternatives = 5;
  r.onresult = e => {
    const target = say(PH[spk.i]);

    for (const a of e.results[0]) { const s = simil(a.transcript, target); if (s >= best.s) best = { t: a.transcript, s } }
    const pct = Math.round(best.s * 100), lvl = pct >= 85 ? 2 : pct >= 60 ? 1 : 0;
    const tone = ['border-rose-400/40 bg-rose-400/5 text-rose-300', 'border-accent/40 bg-accent/5 text-accent', 'border-emerald-400/40 bg-emerald-400/5 text-emerald-400'][lvl];
    $('#spResult').innerHTML = `<div class="fade-up ${lvl ? 'pop' : 'shake'} rounded-2xl border ${tone} p-5">
      <div class="flex items-center gap-4"><span class="font-mono text-4xl font-bold">${pct}%</span><p class="font-semibold text-white">${t('spR' + lvl)}</p></div>
      <p class="mt-3 text-sm text-zinc-500">${t('spHeard')}: <span class="font-thai text-white">${best.t || '—'}</span></p></div>`;
  };
  r.onerror = e => toast(e.error === 'not-allowed' ? t('spMicErr') : e.error === 'no-speech' ? t('spNothing') : t('spSrErr') + e.error);
  r.onend = () => { spk.listening = false; spRender(); icons() };
  spk.listening = true; spRender(); icons();
  r.start();
};
