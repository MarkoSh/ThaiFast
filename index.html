<!doctype html>
<html lang="ru" class="scroll-smooth">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ThaiFast — тайский с нуля</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#09090b">
<meta name="description" content="Тайский язык с нуля: звуки, тоны, алфавит, цифры, нужные фразы и быстрые тренажёры.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Thai:wght@400;500;600;700&family=Noto+Sans+Thai+Looped:wght@500&family=Mali:wght@500&family=Sriracha&family=Charm:wght@700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@600&family=Noto+Sans+Cuneiform&text=%E0%B8%81%F0%92%80%AD&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: { extend: {
    fontFamily: { sans: ['Inter', 'Noto Sans Thai', 'system-ui', 'sans-serif'], thai: ['Noto Sans Thai', 'sans-serif'], loop: ['Noto Sans Thai Looped', 'Noto Sans Thai', 'sans-serif'] },
    colors: { ink: { 950: '#09090b', 900: '#101114', 800: '#17191d', 700: '#23262c', 600: '#33373f' }, accent: '#e8b04b' }
  } }
}
</script>
<script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
<style>
  body { background: #09090b; }
  .flip { perspective: 1200px; }
  .flip-inner { transition: transform .6s cubic-bezier(.2,.8,.2,1); transform-style: preserve-3d; }
  .flip.flipped .flip-inner { transform: rotateY(180deg); }
  .face { backface-visibility: hidden; -webkit-backface-visibility: hidden; }
  .face.back { transform: rotateY(180deg); }
  .reveal { opacity: 0; transform: translateY(24px); transition: opacity .7s, transform .7s cubic-bezier(.2,.8,.2,1); }
  .reveal.in { opacity: 1; transform: none; }
  .tone-path { stroke-dasharray: 100; stroke-dashoffset: 100; transition: stroke-dashoffset .9s cubic-bezier(.2,.8,.2,1); }
  .reveal.in .tone-path, .tone-btn .tone-path { stroke-dashoffset: 0; }
  @keyframes shake { 20%,60% { transform: translateX(-6px) } 40%,80% { transform: translateX(6px) } }
  .shake { animation: shake .4s; }
  @keyframes pop { 50% { transform: scale(1.04) } }
  .pop { animation: pop .35s; }
  @keyframes pulseRing { 0% { box-shadow: 0 0 0 0 rgba(232,176,75,.55) } 100% { box-shadow: 0 0 0 14px rgba(232,176,75,0) } }
  .speaking { animation: pulseRing 1s infinite; color: #e8b04b; border-color: #e8b04b; }
  .kb-key { position: relative; flex: 1 1 0; height: 3.5rem; border-radius: .6rem; border: 1px solid #ffffff1a; background: #0d0e11; transition: background .15s, border-color .15s, transform .1s; }
  .kb-key:hover { background: #ffffff0d; } .kb-key:active { transform: translateY(1px); }
  .kb-used { border-color: #e8b04b80; } .kb-shift-on { background: #e8b04b26; }
  .kb-on, .kb-on * { background: #e8b04b !important; color: #09090b !important; border-color: #e8b04b !important; }
  .say-th { cursor: pointer; color: #e4e4e7; text-decoration: underline dotted #e8b04b80; text-underline-offset: 4px; transition: color .2s; }
  .say-th:hover, .say-th.speaking { color: #e8b04b; animation: none; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(8px) } to { opacity: 1; transform: none } }
  .fade-up { animation: fadeUp .45s cubic-bezier(.2,.8,.2,1); }
  .grid-bg { background-image: linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px); background-size: 48px 48px; }
  input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; }
  input[type=number] { -moz-appearance: textfield; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } .reveal { opacity: 1; transform: none; } }
</style>
</head>
<body class="text-zinc-200 font-sans antialiased selection:bg-accent selection:text-ink-950">

<!-- NAV -->
<header class="fixed top-0 inset-x-0 z-40 border-b border-white/5 bg-ink-950/75 backdrop-blur-xl">
  <nav class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between gap-3">
    <a href="#top" class="flex items-center gap-2 font-bold tracking-tight text-white">
      <span class="grid place-items-center w-8 h-8 rounded-lg bg-accent text-ink-950"><i data-lucide="zap" class="w-4 h-4"></i></span>
      ThaiFast
    </a>
    <div class="hidden lg:flex items-center gap-5 text-sm text-zinc-400">
      <a href="#sounds" class="hover:text-white transition" data-i18n="navSounds"></a>
      <a href="#alphabet" class="hover:text-white transition" data-i18n="navAlpha"></a>
      <a href="#phrases" class="hover:text-white transition" data-i18n="navPhrases"></a>
      <a href="#words" class="hover:text-white transition" data-i18n="navWords"></a>
      <a href="#grammar" class="hover:text-white transition" data-i18n="navGram"></a>
      <a href="#dialogs" class="hover:text-white transition" data-i18n="navDialogs"></a>
      <a href="#etiquette" class="hover:text-white transition" data-i18n="navEtq"></a>
      <a href="#train" class="hover:text-white transition" data-i18n="navTrain"></a>
    </div>
    <div class="flex items-center gap-2">
      <div class="flex rounded-lg border border-white/10 p-0.5 text-xs font-semibold" role="group" aria-label="Gender">
        <button data-gender="m" class="px-2.5 py-1.5 rounded-md transition flex items-center gap-1"><i data-lucide="user" class="w-3.5 h-3.5"></i><span data-i18n="male"></span></button>
        <button data-gender="f" class="px-2.5 py-1.5 rounded-md transition flex items-center gap-1"><i data-lucide="user-round" class="w-3.5 h-3.5"></i><span data-i18n="female"></span></button>
      </div>
      <div class="flex rounded-lg border border-white/10 p-0.5 text-xs font-semibold" role="group" aria-label="Language">
        <button data-lang="ru" class="px-2.5 py-1.5 rounded-md transition">RU</button>
        <button data-lang="en" class="px-2.5 py-1.5 rounded-md transition">EN</button>
      </div>
    </div>
  </nav>
</header>

<main id="top">
  <!-- HERO -->
  <section class="relative overflow-hidden pt-32 pb-20 md:pt-40 md:pb-28 grid-bg">
    <div class="absolute -top-40 left-1/2 -translate-x-1/2 w-[900px] h-[600px] rounded-full bg-accent/10 blur-3xl pointer-events-none"></div>
    <div class="relative max-w-6xl mx-auto px-4 grid md:grid-cols-2 gap-12 items-center">
      <div class="reveal">
        <div class="inline-flex items-center gap-2 rounded-full border border-white/10 bg-white/5 px-3 py-1 text-xs text-zinc-400">
          <i data-lucide="timer" class="w-3.5 h-3.5 text-accent"></i><span data-i18n="badge"></span>
        </div>
        <h1 class="mt-6 text-4xl md:text-6xl font-extrabold tracking-tight text-white leading-[1.05]" data-i18n="heroTitle"></h1>
        <p class="mt-5 text-lg text-zinc-400 max-w-md" data-i18n="heroSub"></p>
        <div class="mt-8 flex flex-wrap gap-3">
          <a href="#sounds" class="inline-flex items-center gap-2 rounded-xl bg-accent px-5 py-3 font-semibold text-ink-950 hover:brightness-110 transition">
            <span data-i18n="ctaStart"></span><i data-lucide="arrow-right" class="w-4 h-4"></i>
          </a>
          <a href="#train" class="inline-flex items-center gap-2 rounded-xl border border-white/10 px-5 py-3 font-semibold text-white hover:bg-white/5 transition">
            <i data-lucide="dumbbell" class="w-4 h-4"></i><span data-i18n="ctaTrain"></span>
          </a>
        </div>
        <dl class="mt-10 grid grid-cols-3 gap-4 max-w-sm text-sm">
          <div><dt class="text-2xl font-bold text-white">44</dt><dd class="text-zinc-500" data-i18n="statLetters"></dd></div>
          <div><dt class="text-2xl font-bold text-white" id="statPhrases"></dt><dd class="text-zinc-500" data-i18n="statPhrases"></dd></div>
          <div><dt class="text-2xl font-bold text-white" id="statWords"></dt><dd class="text-zinc-500" data-i18n="statWords"></dd></div>
        </dl>
      </div>

      <div class="reveal">
        <div class="relative rounded-3xl border border-white/10 bg-ink-900/80 p-8 shadow-2xl shadow-black/50">
          <div class="flex items-center justify-between text-xs text-zinc-500">
            <span class="flex items-center gap-2"><span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span><span data-i18n="heroCard"></span></span>
            <span id="heroIdx" class="font-mono"></span>
          </div>
          <div id="heroWord" class="mt-8 min-h-[190px]"></div>
          <div class="mt-6 flex items-center gap-3">
            <button id="heroPlay" class="grid place-items-center w-12 h-12 rounded-full border border-white/15 hover:border-accent hover:text-accent transition" aria-label="Play"><i data-lucide="volume-2" class="w-5 h-5"></i></button>
            <div class="ml-auto flex gap-3">
              <button id="heroPrev" class="grid place-items-center w-12 h-12 rounded-full border border-white/15 hover:bg-white/5 transition" aria-label="Previous"><i data-lucide="chevron-left" class="w-5 h-5"></i></button>
              <button id="heroNext" class="grid place-items-center w-12 h-12 rounded-full border border-white/15 hover:bg-white/5 transition" aria-label="Next"><i data-lucide="chevron-right" class="w-5 h-5"></i></button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- 01 SOUNDS -->
  <section id="sounds" class="py-20 md:py-28 border-t border-white/5">
    <div class="max-w-6xl mx-auto px-4">
      <div class="reveal max-w-2xl">
        <p class="font-mono text-sm text-accent">01</p>
        <h2 class="mt-2 text-3xl md:text-4xl font-bold text-white tracking-tight" data-i18n="soundsTitle"></h2>
        <p class="mt-3 text-zinc-400" data-i18n="soundsSub"></p>
      </div>
      <div id="soundsGrid" class="mt-10 grid sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>
      <div class="reveal mt-6 flex items-start gap-3 rounded-2xl border border-accent/20 bg-accent/5 p-5 text-sm">
        <i data-lucide="ruler" class="w-5 h-5 text-accent shrink-0 mt-0.5"></i>
        <p class="text-zinc-300" data-i18n="lengthNote"></p>
      </div>
    </div>
  </section>

  <!-- 02 TONES -->
  <section id="tones" class="py-20 md:py-28 border-t border-white/5 bg-ink-900/40">
    <div class="max-w-6xl mx-auto px-4">
      <div class="reveal max-w-2xl">
        <p class="font-mono text-sm text-accent">02</p>
        <h2 class="mt-2 text-3xl md:text-4xl font-bold text-white tracking-tight" data-i18n="tonesTitle"></h2>
        <p class="mt-3 text-zinc-400" data-i18n="tonesSub"></p>
      </div>
      <div id="tonesGrid" class="reveal mt-10 grid grid-cols-2 md:grid-cols-5 gap-3"></div>
      <div class="reveal mt-6 rounded-2xl border border-white/10 bg-ink-950 p-6 flex flex-col md:flex-row md:items-center gap-4 justify-between">
        <div>
          <p class="text-xs uppercase tracking-widest text-zinc-500" data-i18n="twister"></p>
          <p class="mt-2 font-thai text-3xl text-white">ไม้ใหม่ไม่ไหม้ไหม</p>
          <p class="mt-1 font-mono text-accent">mái mài mâi mâi mǎi</p>
          <p class="mt-1 text-sm text-zinc-400" data-i18n="twisterTr"></p>
        </div>
        <button data-say="ไม้ใหม่ไม่ไหม้ไหม" class="self-start md:self-auto inline-flex items-center gap-2 rounded-xl border border-white/15 px-4 py-2.5 text-sm font-semibold hover:border-accent hover:text-accent transition">
          <i data-lucide="volume-2" class="w-4 h-4"></i><span data-i18n="listen"></span>
        </button>
      </div>
    </div>
  </section>

  <!-- 03 ALPHABET -->
  <section id="alphabet" class="py-20 md:py-28 border-t border-white/5">
    <div class="max-w-6xl mx-auto px-4">
      <div class="reveal flex flex-col md:flex-row md:items-end justify-between gap-6">
        <div class="max-w-2xl">
          <p class="font-mono text-sm text-accent">03</p>
          <h2 class="mt-2 text-3xl md:text-4xl font-bold text-white tracking-tight" data-i18n="alphaTitle"></h2>
          <p class="mt-3 text-zinc-400" data-i18n="alphaSub"></p>
        </div>
      </div>
      <div class="reveal mt-10 rounded-3xl border border-white/10 bg-ink-900/60 p-5 md:p-8">
        <div class="flex flex-col md:flex-row md:items-start justify-between gap-4">
          <div class="max-w-2xl">
            <h3 class="text-xl font-bold text-white flex items-center gap-2"><i data-lucide="layout-grid" class="w-5 h-5 text-accent"></i><span data-i18n="posterTitle"></span></h3>
            <p class="mt-2 text-sm text-zinc-400" data-i18n="posterSub"></p>
          </div>
          <div class="flex self-start rounded-lg border border-white/10 p-0.5 text-xs font-semibold shrink-0">
            <button data-pfont="loop" class="px-3 py-1.5 rounded-md transition" data-i18n="fontLoop"></button>
            <button data-pfont="print" class="px-3 py-1.5 rounded-md transition" data-i18n="fontPrint"></button>
          </div>
        </div>
        <div id="poster" class="mt-6"></div>
      </div>

      <div id="classTabs" class="reveal mt-10 flex flex-wrap gap-2"></div>
      <div class="reveal mt-4 grid lg:grid-cols-[1fr_340px] gap-6 items-start">
        <div id="consGrid" class="grid grid-cols-5 sm:grid-cols-8 lg:grid-cols-9 gap-2"></div>
        <aside id="consDetail" class="lg:sticky lg:top-24 rounded-2xl border border-white/10 bg-ink-900 p-6"></aside>
      </div>

      <div class="reveal mt-14">
        <h3 class="text-xl font-bold text-white" data-i18n="vowelsTitle"></h3>
        <p class="mt-2 text-sm text-zinc-400 max-w-2xl" data-i18n="vowelsSub"></p>
        <div id="vowelGrid" class="mt-6 grid grid-cols-3 sm:grid-cols-5 lg:grid-cols-8 gap-2"></div>
      </div>
    </div>
  </section>

  <!-- 04 PHRASES -->
  <section id="phrases" class="py-20 md:py-28 border-t border-white/5 bg-ink-900/40">
    <div class="max-w-6xl mx-auto px-4">
      <div class="reveal max-w-2xl">
        <p class="font-mono text-sm text-accent">04</p>
        <h2 class="mt-2 text-3xl md:text-4xl font-bold text-white tracking-tight" data-i18n="phrasesTitle"></h2>
        <p class="mt-3 text-zinc-400" data-i18n="phrasesSub"></p>
      </div>
      <div id="catTabs" class="reveal mt-8 flex flex-wrap gap-2"></div>
      <div id="phraseGrid" class="mt-8 grid sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>

      <!-- Bill -->
      <div class="reveal mt-14 rounded-3xl border border-accent/25 bg-ink-950 p-6 md:p-8">
        <div class="flex items-center gap-3">
          <span class="grid place-items-center w-10 h-10 rounded-xl bg-accent/15 text-accent"><i data-lucide="receipt" class="w-5 h-5"></i></span>
          <div>
            <h3 class="text-xl font-bold text-white" data-i18n="billTitle"></h3>
            <p class="text-sm text-zinc-400" data-i18n="billSub"></p>
          </div>
        </div>
        <div class="mt-6 grid md:grid-cols-[260px_1fr] gap-6">
          <div id="billOpts" class="grid grid-cols-2 md:grid-cols-1 gap-2"></div>
          <div id="billOut" class="rounded-2xl border border-white/10 bg-ink-900 p-6 min-h-[220px] flex flex-col justify-center"></div>
        </div>
      </div>
    </div>
  </section>

  <!-- 05 WORDS -->
  <section id="words" class="py-20 md:py-28 border-t border-white/5">
    <div class="max-w-6xl mx-auto px-4">
      <div class="reveal flex flex-col gap-6">
        <div class="max-w-2xl">
          <p class="font-mono text-sm text-accent">05</p>
          <h2 class="mt-2 text-3xl md:text-4xl font-bold text-white tracking-tight" data-i18n="wordsTitle"></h2>
          <p class="mt-3 text-zinc-400" data-i18n="wordsSub"></p>
        </div>
        <div class="flex flex-wrap self-start rounded-2xl border border-white/10 bg-ink-900 p-1 text-sm font-semibold">
          <button data-vtab="num" class="vtab px-4 py-2 rounded-xl flex items-center gap-2 transition"><i data-lucide="hash" class="w-4 h-4"></i><span data-i18n="vNum"></span></button>
          <button data-vtab="body" class="vtab px-4 py-2 rounded-xl flex items-center gap-2 transition"><i data-lucide="person-standing" class="w-4 h-4"></i><span data-i18n="vBody"></span></button>
          <button data-vtab="verb" class="vtab px-4 py-2 rounded-xl flex items-center gap-2 transition"><i data-lucide="move-right" class="w-4 h-4"></i><span data-i18n="vVerb"></span></button>
          <button data-vtab="ques" class="vtab px-4 py-2 rounded-xl flex items-center gap-2 transition"><i data-lucide="circle-help" class="w-4 h-4"></i><span data-i18n="vQues"></span></button>
          <button data-vtab="cls" class="vtab px-4 py-2 rounded-xl flex items-center gap-2 transition"><i data-lucide="shopping-cart" class="w-4 h-4"></i><span data-i18n="vCls"></span></button>
          <button data-vtab="food" class="vtab px-4 py-2 rounded-xl flex items-center gap-2 transition"><i data-lucide="soup" class="w-4 h-4"></i><span data-i18n="vFood"></span></button>
        </div>
      </div>

      <!-- Numbers -->
      <div data-vpanel="num" class="mt-10">
        <div class="rounded-3xl border border-white/10 bg-ink-900 p-6 md:p-8 grid md:grid-cols-[280px_1fr] gap-8 items-center">
          <div>
            <p class="text-sm font-semibold text-white flex items-center gap-2"><i data-lucide="calculator" class="w-4 h-4 text-accent"></i><span data-i18n="numBuilder"></span></p>
            <div class="mt-4 flex items-center gap-2">
              <button id="numMinus" class="grid place-items-center w-11 h-11 rounded-xl border border-white/10 hover:bg-white/5 transition" aria-label="-"><i data-lucide="minus" class="w-4 h-4"></i></button>
              <input id="numIn" type="number" min="0" max="99999" value="250" class="w-full h-11 rounded-xl border border-white/10 bg-ink-950 px-3 text-center font-mono text-lg text-white focus:outline-none focus:border-accent">
              <button id="numPlus" class="grid place-items-center w-11 h-11 rounded-xl border border-white/10 hover:bg-white/5 transition" aria-label="+"><i data-lucide="plus" class="w-4 h-4"></i></button>
            </div>
            <button id="numRand" class="mt-3 w-full rounded-xl border border-white/10 py-2.5 text-sm font-semibold hover:border-accent hover:text-accent transition flex items-center justify-center gap-2"><i data-lucide="shuffle" class="w-4 h-4"></i><span data-i18n="numRandom"></span></button>
          </div>
          <div id="numOut"></div>
        </div>
        <div id="numGrid" class="mt-6 grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-8 gap-3"></div>
        <p class="mt-6 flex items-start gap-3 text-sm text-zinc-400"><i data-lucide="info" class="w-4 h-4 text-accent shrink-0 mt-0.5"></i><span data-i18n="numNote"></span></p>
      </div>

      <!-- Body -->
      <div data-vpanel="body" class="hidden mt-10">
        <div class="flex items-start gap-3 rounded-2xl border border-accent/20 bg-accent/5 p-5 text-sm">
          <i data-lucide="stethoscope" class="w-5 h-5 text-accent shrink-0 mt-0.5"></i>
          <p class="text-zinc-300" data-i18n="bodyNote"></p>
        </div>
        <div id="bodyGrid" class="mt-6 grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-3"></div>
      </div>

      <!-- Verbs -->
      <div data-vpanel="verb" class="hidden mt-10">
        <div class="rounded-3xl border border-white/10 bg-ink-900 p-6 md:p-8">
          <p class="text-sm font-semibold text-white flex items-center gap-2"><i data-lucide="blocks" class="w-4 h-4 text-accent"></i><span data-i18n="sentBuilder"></span></p>
          <div id="modalOpts" class="mt-4 flex flex-wrap gap-2"></div>
          <div id="sentOut" class="mt-6 rounded-2xl border border-white/10 bg-ink-950 p-6"></div>
          <p class="mt-4 flex items-start gap-3 text-sm text-zinc-400"><i data-lucide="sparkles" class="w-4 h-4 text-accent shrink-0 mt-0.5"></i><span data-i18n="verbNote"></span></p>
        </div>
        <div id="verbGrid" class="mt-6 grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-3"></div>
      </div>

      <!-- Questions -->
      <div data-vpanel="ques" class="hidden mt-10">
        <div class="flex items-start gap-3 rounded-2xl border border-accent/20 bg-accent/5 p-5 text-sm">
          <i data-lucide="message-circle-question" class="w-5 h-5 text-accent shrink-0 mt-0.5"></i>
          <p class="text-zinc-300" data-i18n="quesNote"></p>
        </div>
        <div id="qwGrid" class="mt-6 grid sm:grid-cols-2 lg:grid-cols-3 gap-3"></div>
        <h3 class="mt-10 text-lg font-bold text-white" data-i18n="qpTitle"></h3>
        <div id="qpGrid" class="mt-4 grid sm:grid-cols-2 lg:grid-cols-5 gap-3"></div>
      </div>

      <!-- Classifiers -->
      <div data-vpanel="cls" class="hidden mt-10">
        <div class="rounded-3xl border border-white/10 bg-ink-900 p-6 md:p-8">
          <p class="text-sm font-semibold text-white flex items-center gap-2"><i data-lucide="shopping-cart" class="w-4 h-4 text-accent"></i><span data-i18n="orderBuilder"></span></p>
          <div id="orderItems" class="mt-4 flex flex-wrap gap-2"></div>
          <div id="orderNums" class="mt-3 flex flex-wrap gap-2"></div>

const U_TH = ['', 'หนึ่ง', 'สอง', 'สาม', 'สี่', 'ห้า', 'หก', 'เจ็ด', 'แปด', 'เก้า'];
const U_LAT = ['', 'nùeng', 'sǒng', 'sǎam', 'sìi', 'hâa', 'hòk', 'jèt', 'bpàet', 'gâo'];
const U_CYR = ['', 'нынг', 'сонг', 'сам', 'си', 'ха', 'хок', 'джет', 'пэт', 'као'];
function thaiNum(n) {
  if (n === 0) return { th: 'ศูนย์', lat: 'sǔun', cyr: 'сун', parts: ['ศูนย์'] };
  const out = { th: [], lat: [], cyr: [] };
  const add = (a, b, c) => { out.th.push(a); out.lat.push(b); out.cyr.push(c) };
  const big = [[10000, 'หมื่น', 'mùuen', 'мын'], [1000, 'พัน', 'phan', 'пхан'], [100, 'ร้อย', 'rói', 'рой']];
  for (const [v, th, lat, cyr] of big) {
    const d = Math.floor(n / v) % 10;
    if (d) add(U_TH[d] + th, `${U_LAT[d]} ${lat}`, `${U_CYR[d]} ${cyr}`);
  }
  const t = Math.floor(n / 10) % 10, u = n % 10;
  if (t === 1) add('สิบ', 'sìp', 'сип');
  else if (t === 2) add('ยี่สิบ', 'yîi-sìp', 'йи-сип');

function orderPhrase(it, n) {

}

/* trace */
// Scoring compares pixels: glyph vs. user ink, each with a tolerance halo.
// ponytail: no stroke-order check — needs per-letter stroke data we don't have.
const TR_SETS = {
  cons: () => CONS.filter(c => !c.old).map(c => ({ g: c.ch, say: c.ch + ' ' + c.word, lat: c.name, ru: c.ru, en: c.en })),
  vow: () => VOWELS.map(([g, lat, ru, en]) => ({ g, say: g, lat, ru, en })),
  dig: () => NUM.slice(0, 10).map(x => ({ g: x.digit, say: x.th, lat: x.lat, ru: x.ru + ' · ' + x.th, en: x.en + ' · ' + x.th }))
};
const TR_W = 340;
// glyph size (share of the canvas), brush width and scoring tolerance per size; small one is meant for a stylus
const TR_SIZES = { l: { k: .62, brush: 15, tol: 9 }, m: { k: .32, brush: 10, tol: 7 }, s: { k: .17, brush: 5, tol: 4 }, xs: { k: .085, brush: 2.5, tol: 2.5 } };

const tr = { set: 'cons', size: 'm', i: 0, strokes: [], drawing: false, checked: false };
const trSz = () => TR_SIZES[tr.size];
// template styles: printed with loops + three handwriting fonts
const TR_STYLES = { loop: ['Noto Sans Thai Looped', 500], school: ['Mali', 500], hand: ['Sriracha', 400], cursive: ['Charm', 700] };
tr.style = 'loop'; tr.slant = 0;
const trFontCss = fs => { const [fam, w] = TR_STYLES[tr.style]; return `${w} ${fs}px '${fam}'` };
const trCv = $('#trCanvas'), trCtx = trCv.getContext('2d');
const trDpr = Math.min(window.devicePixelRatio || 1, 3);
trCv.width = trCv.height = TR_W * trDpr;
const trList = () => TR_SETS[tr.set]();
const trCur = () => trList()[tr.i];

// Copybook mode (only for the "writing" size): the letter is repeated in a grid of cells
const TR_PROP = { cols: 4, rows: 4 };
tr.prop = true;
const trPropOn = () => tr.size === 'xs' && tr.prop;
const trCells = () => {
  if (!trPropOn()) return [[TR_W / 2, TR_W / 2]];
  const { cols, rows } = TR_PROP, out = [];
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) out.push([TR_W * (c + .5) / cols, TR_W * (r + .5) / rows]);
  return out;
};
const trCellOf = (x, y) => {
  const { cols, rows } = TR_PROP;
  return Math.min(rows - 1, y * rows / TR_W | 0) * cols + Math.min(cols - 1, x * cols / TR_W | 0);
};

function trFont(ctx, text, cx, cy) {
  let fs = TR_W * trSz().k;
  ctx.font = trFontCss(fs);
  let m = ctx.measureText(text);
  const w = m.actualBoundingBoxLeft + m.actualBoundingBoxRight, h = m.actualBoundingBoxAscent + m.actualBoundingBoxDescent;
  fs *= Math.min(TR_W * trSz().k * 1.08 / Math.max(w, h, 1), 1.5);
  ctx.font = trFontCss(fs);

  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  return {
    x: cx - (m.actualBoundingBoxRight - m.actualBoundingBoxLeft) / 2,
    y: cy + (m.actualBoundingBoxAscent - m.actualBoundingBoxDescent) / 2

}
// draws the glyph in every cell, or only in cell `only`
function trGlyph(ctx, color, halo = 0, only = -1) {
  const g = trCur().g;
  trCells().forEach(([cx, cy], k) => {
    if (only >= 0 && k !== only) return;
    const { x, y } = trFont(ctx, g, cx, cy);
    ctx.save();
    // slant around the cell centre (positive = leaning right, like handwriting)
    ctx.translate(cx, cy); ctx.transform(1, 0, -Math.tan(tr.slant * Math.PI / 180), 1, 0, 0); ctx.translate(-cx, -cy);
    ctx.fillStyle = ctx.strokeStyle = color;
    ctx.fillText(g, x, y);
    if (halo) { ctx.lineWidth = halo * 2; ctx.lineJoin = 'round'; ctx.strokeText(g, x, y) }

}
function trInk(ctx, color, width) {
  ctx.strokeStyle = ctx.fillStyle = color; ctx.lineWidth = width; ctx.lineCap = ctx.lineJoin = 'round';
  for (const st of tr.strokes) {
    if (st.length === 1) { ctx.beginPath(); ctx.arc(st[0][0], st[0][1], width / 2, 0, 7); ctx.fill(); continue }
    ctx.beginPath(); ctx.moveTo(...st[0]); st.forEach(p => ctx.lineTo(...p)); ctx.stroke();

}
function trGuides() {
  const c = trCtx;
  if (!trPropOn()) {
    c.strokeStyle = 'rgba(255,255,255,.05)'; c.lineWidth = 1; c.setLineDash([4, 6]);
    c.beginPath(); c.moveTo(TR_W / 2, 0); c.lineTo(TR_W / 2, TR_W); c.moveTo(0, TR_W / 2); c.lineTo(TR_W, TR_W / 2); c.stroke();
    c.setLineDash([]);

  }
  // copybook ruling: top / bottom line per row, dashed midline, faint cell dividers
  const { cols, rows } = TR_PROP, half = TR_W * trSz().k * .75;
  for (let r = 0; r < rows; r++) {
    const cy = TR_W * (r + .5) / rows;
    c.strokeStyle = 'rgba(255,255,255,.12)'; c.lineWidth = 1;
    c.beginPath(); c.moveTo(8, cy - half); c.lineTo(TR_W - 8, cy - half); c.moveTo(8, cy + half); c.lineTo(TR_W - 8, cy + half); c.stroke();
    c.strokeStyle = 'rgba(255,255,255,.06)'; c.setLineDash([3, 5]);
    c.beginPath(); c.moveTo(8, cy); c.lineTo(TR_W - 8, cy); c.stroke(); c.setLineDash([]);
  }

}
function trRedraw() {

  trGuides();
  if (!$('#trHide').checked) {
    if (trPropOn()) { trGlyph(trCtx, 'rgba(255,255,255,.07)'); trGlyph(trCtx, 'rgba(255,255,255,.3)', 0, 0) }
    else trGlyph(trCtx, 'rgba(255,255,255,.13)');
  }
  trInk(trCtx, '#e8b04b', trSz().brush);
}
function trMask(draw) {
  const N = TR_W * TR_EV, c = document.createElement('canvas'); c.width = c.height = N;
  const ctx = c.getContext('2d', { willReadFrequently: true });

}
const f1 = (cover, prec) => Math.round(200 * cover * prec / (cover + prec || 1));
function trCheck() {
  if (!tr.strokes.length) return toast(t('trEmpty'));
  const G = trMask(c => trGlyph(c, '#fff')), Gd = trMask(c => trGlyph(c, '#fff', trSz().tol));
  const U = trMask(c => trInk(c, '#fff', trSz().brush)), Ud = trMask(c => trInk(c, '#fff', trSz().brush + trSz().tol * 2));
  const N = TR_W * TR_EV, nc = trCells().length;

  const paint = (i, r, gg, b, a) => { px[i * 4] = r; px[i * 4 + 1] = gg; px[i * 4 + 2] = b; px[i * 4 + 3] = a };
  for (let i = 0; i < G.length; i++) {
    if (!G[i] && !U[i]) continue;
    const s = cell[nc > 1 ? trCellOf((i % N) / TR_EV, (i / N | 0) / TR_EV) : 0];
    if (G[i]) { s.g++; if (Ud[i]) { s.gHit++; paint(i, 52, 211, 153, 255) } else paint(i, 251, 113, 133, 255) }
    if (U[i]) { s.u++; if (Gd[i]) s.uHit++; else if (!G[i]) paint(i, 251, 146, 60, 150) }
  }
  // copybook: every cell must contain writing before it is graded
  const filled = cell.filter(s => s.u > s.g * .15).length;
  if (nc > 1 && filled < nc) return toast(t('trPropLeft').replace('{n}', filled).replace('{total}', nc));
  const scores = cell.map(s => f1(s.gHit / s.g, s.u ? s.uHit / s.u : 0));
  const sum = cell.reduce((a, s) => ({ g: a.g + s.g, gHit: a.gHit + s.gHit, u: a.u + s.u, uHit: a.uHit + s.uHit }), { g: 0, gHit: 0, u: 0, uHit: 0 });

  if (nc > 1) { const worst = Math.min(...scores); stars = Math.min(stars, worst >= 75 ? 3 : worst >= 55 ? 2 : 1) }

  $('#trResult').innerHTML = `<div class="fade-up ${stars ? 'pop' : 'shake'}">
    <div class="flex items-center gap-4">
      <span class="font-mono text-5xl font-bold ${stars >= 2 ? 'text-emerald-400' : stars ? 'text-accent' : 'text-rose-400'}">${score}<span class="text-2xl">%</span></span>
      <div><div class="flex gap-1">${[1, 2, 3].map(n => `<i data-lucide="star" class="w-5 h-5 ${n <= stars ? 'text-accent fill-accent' : 'text-zinc-700'}"></i>`).join('')}</div>
      <p class="mt-1 font-semibold text-white">${t('trR' + stars)}</p></div>
    </div>
    ${nc > 1 ? `<div class="mt-4 grid gap-1.5" style="grid-template-columns:repeat(${TR_PROP.cols},minmax(0,1fr))">${scores.map((v, k) => `<div class="rounded-lg border ${tone(v)} bg-ink-900 py-1.5 text-center font-mono text-xs">${k + 1} · ${v}%</div>`).join('')}</div>` : ''}
    <div class="mt-4 grid grid-cols-2 gap-3 text-sm">
      <div><p class="text-zinc-500">${t('trCover')}</p><div class="mt-1 h-1.5 rounded-full bg-white/5 overflow-hidden"><div class="h-full bg-emerald-400" style="width:${cover * 100}%"></div></div><p class="mt-1 font-mono text-xs text-zinc-400">${Math.round(cover * 100)}%</p></div>
      <div><p class="text-zinc-500">${t('trPrec')}</p><div class="mt-1 h-1.5 rounded-full bg-white/5 overflow-hidden"><div class="h-full bg-accent" style="width:${prec * 100}%"></div></div><p class="mt-1 font-mono text-xs text-zinc-400">${Math.round(prec * 100)}%</p></div>
    </div>
    <p class="mt-3 text-xs text-zinc-500">${t('trLegend')}</p></div>`;
  icons();
}

/* speak: record yourself + speech recognition check */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

    rec.onstop = () => {
      stream.getTracks().forEach(tr => tr.stop());
      spk.recording = false;
      if (spk.url) URL.revokeObjectURL(spk.url);
      spk.url = URL.createObjectURL(new Blob(chunks, { type: rec.mimeType }));
      spRender(); icons();
      new Audio(spk.url).play();
    };
    rec.start(); spk.recording = true; spRender(); icons();
    setTimeout(() => rec.state === 'recording' && rec.stop(), 7000);
  } catch (e) { toast(t('spMicErr')) }
};
$('#spCheck').onclick = () => {
  if (!SR || spk.listening) return;
  const r = new SR();
  r.lang = 'th-TH'; r.interimResults = false; r.maxAlternatives = 5;
  r.onresult = e => {
    const target = say(PH[spk.i]);
    let best = { t: '', s: 0 };
    for (const a of e.results[0]) { const s = simil(a.transcript, target); if (s >= best.s) best = { t: a.transcript, s } }
    const pct = Math.round(best.s * 100), lvl = pct >= 85 ? 2 : pct >= 60 ? 1 : 0;
    const tone = ['border-rose-400/40 bg-rose-400/5 text-rose-300', 'border-accent/40 bg-accent/5 text-accent', 'border-emerald-400/40 bg-emerald-400/5 text-emerald-400'][lvl];
    $('#spResult').innerHTML = `<div class="fade-up ${lvl ? 'pop' : 'shake'} rounded-2xl border ${tone} p-5">
      <div class="flex items-center gap-4"><span class="font-mono text-4xl font-bold">${pct}%</span><p class="font-semibold text-white">${t('spR' + lvl)}</p></div>
      <p class="mt-3 text-sm text-zinc-500">${t('spHeard')}: <span class="font-thai text-white">${best.t || '—'}</span></p></div>`;
  };
  r.onerror = e => toast(e.error === 'not-allowed' ? t('spMicErr') : e.error === 'no-speech' ? t('spNothing') : t('spSrErr') + e.error);
  r.onend = () => { spk.listening = false; spRender(); icons() };
  spk.listening = true; spRender(); icons();
  r.start();
};

/* ================= TOGGLES & INIT ================= */
/* ================= KEYBOARD ================= */
// Kedmanee, the standard Thai layout. Each row: Latin key labels, Thai, Thai with Shift
const KB_ROWS = [
  ['`1234567890-=', '_ๅ/-ภถุึคตจขช', '%+๑๒๓๔ู฿๕๖๗๘๙'],
  ['qwertyuiop[]\\', 'ๆไำพะัีรนยบลฃ', '๐"ฎฑธํ๊ณฯญฐ,ฅ'],
  ["asdfghjkl;'", 'ฟหกดเ้่าสวง', 'ฤฆฏโฌ็๋ษศซ.'],
  ['zxcvbnm,./', 'ผปแอิืทมใฝ', '()ฉฮฺ์?ฒฬฦ'],
];
const KB_HINT = {};                       // small accent label per Latin key (used by SumerFast)
const KB_EX = ['สวัสดี', 'ขอบคุณ', 'ครับ', 'น้ำ', 'ไม่เป็นไร'];
const kbConv = s => s;                    // typed text -> shown text
const kbKeys = s => s;                    // shown text -> characters on the keys
const kbOut = () => '';                   // extra result under the field
const KB_CODE = { '`': 'Backquote', '-': 'Minus', '=': 'Equal', '[': 'BracketLeft', ']': 'BracketRight', '\\': 'Backslash', ';': 'Semicolon', "'": 'Quote', ',': 'Comma', '.': 'Period', '/': 'Slash' };
const KB = KB_ROWS.flatMap(([lat, base, shift], r) => {
  const b = [...base], sh = [...shift];
  return [...lat].map((l, i) => ({ r, l, code: KB_CODE[l] || (/\d/.test(l) ? 'Digit' + l : 'Key' + l.toUpperCase()), base: b[i], shift: sh[i] }));
});
const KB_FIND = new Map();
KB.forEach(k => KB_FIND.set(k.shift, [k, 1])); KB.forEach(k => KB_FIND.set(k.base, [k, 0]));
const esc = v => String(v).replace(/[&<>"]/g, c => `&#${c.charCodeAt(0)};`);
const kbShow = ch => /\p{M}/u.test(ch) ? '◌' + ch : ch;
let kbShift = false, kbTimer;
// one entry per shown character, with the keys that type it: [{ code, l, sh }] (null = no key)
const kbSeq = v => [...v].map(ch => ({ ch, keys: ch === ' ' ? [{ code: 'Space', l: 'Space' }] : [...kbKeys(ch)].map(c => KB_FIND.has(c) ? { code: KB_FIND.get(c)[0].code, l: KB_FIND.get(c)[0].l, sh: KB_FIND.get(c)[1] } : null) }));
const kbBtn = (code, inner, cls = '') => `<button type="button" data-kb="${code}" class="kb-key ${cls}">${inner}</button>`;
function kbRender() {
  $('#kbIn').placeholder = t('kbPh');
  $('#kbRows').innerHTML = KB_ROWS.map((_, r) => `<div class="flex gap-1.5" style="padding-left:${[0, 3.5, 5.5, 8.5][r]}%">${KB.filter(k => k.r === r).map(k => kbBtn(k.code, `
    <span class="absolute left-1.5 top-1 font-mono text-[10px] uppercase text-zinc-500">${esc(k.l)}</span>
    <span class="absolute right-1.5 top-1 text-xs ${KB_HINT[k.l] ? 'text-accent font-semibold' : 'text-zinc-500 font-thai'}">${esc(KB_HINT[k.l] || kbShow(k.shift))}</span>
    <span class="font-thai text-xl text-white">${esc(kbShow(k.base))}</span>`)).join('')}</div>`).join('') + `
    <div class="flex gap-1.5">${kbBtn('Shift', '<span class="text-xs text-zinc-300">⇧ Shift</span>', '!flex-[2]')}${kbBtn('Space', '<span class="text-xs text-zinc-500">Space</span>', '!flex-[6]')}${kbBtn('Backspace', '<span class="text-xs text-zinc-300">⌫</span>', '!flex-[2]')}</div>`;
  $('#kbEx').innerHTML = KB_EX.map(w => `<button type="button" data-kbex="${esc(w)}" class="rounded-lg border border-white/10 px-3 py-1.5 font-thai text-white hover:border-accent/60 transition">${esc(w)}</button>`).join('');
  kbUpdate();
}
function kbUpdate() {
  const v = $('#kbIn').value, seq = kbSeq(v);
  const keys = seq.flatMap(x => x.keys).filter(Boolean);
  $$('.kb-key').forEach(b => b.classList.toggle('kb-used', keys.some(k => k.code === b.dataset.kb || (b.dataset.kb === 'Shift' && k.sh))));
  $('[data-kb="Shift"]').classList.toggle('kb-shift-on', kbShift);
  $('#kbSeq').innerHTML = seq.length ? seq.map((x, i) => `<span data-kbi="${i}" class="inline-flex flex-col items-center min-w-[44px] rounded-lg border border-white/10 bg-ink-950 px-2 py-1">
    <span class="font-thai text-lg leading-tight text-white">${x.ch === ' ' ? '␣' : esc(kbShow(x.ch))}</span>
    <span class="font-mono text-[11px] text-zinc-500">${x.keys.map(k => k ? (k.sh ? '⇧ ' : '') + esc(k.l.length > 1 ? k.l : k.l.toUpperCase()) : '?').join(' ')}</span></span>`).join('') : `<span class="self-center text-sm text-zinc-500">${t('kbEmpty')}</span>`;
  $('#kbSay').dataset.say = v.trim(); $('#kbSay').classList.toggle('invisible', !v.trim());
  $('#kbOut').innerHTML = kbOut(v.trim());
}
function kbType(ch) {
  const el = $('#kbIn');
  el.setRangeText(ch, el.selectionStart ?? el.value.length, el.selectionEnd ?? el.value.length, 'end');
  const v = kbConv(el.value); if (v !== el.value) el.value = v;
  kbUpdate();
}
function kbFlash(code) {
  const b = $(`[data-kb="${code}"]`); if (!b) return;
  b.classList.add('kb-on'); setTimeout(() => b.classList.remove('kb-on'), 160);
}
function kbPlay() {
  clearTimeout(kbTimer);
  const steps = kbSeq($('#kbIn').value).flatMap((x, i) => x.keys.map(k => ({ i, k })));
  $$('.kb-on').forEach(b => b.classList.remove('kb-on'));
  const step = i => {
    $$('.kb-on').forEach(b => b.classList.remove('kb-on'));
    if (i >= steps.length) return;
    const { i: ci, k } = steps[i];
    $(`[data-kbi="${ci}"]`)?.classList.add('kb-on');
    if (k) $(`[data-kb="${k.code}"]`)?.classList.add('kb-on');
    if (k?.sh) $('[data-kb="Shift"]').classList.add('kb-on');
    kbTimer = setTimeout(() => { $$('.kb-on').forEach(b => b.classList.remove('kb-on')); kbTimer = setTimeout(() => step(i + 1), 120) }, 520);
  };
  step(0);
}
$('#kbIn').addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey || e.isComposing) return;
  const k = KB.find(k => k.code === e.code); if (!k) return;
  e.preventDefault(); kbType(e.shiftKey ? k.shift : k.base); kbFlash(k.code);
});
$('#kbIn').addEventListener('input', e => { const el = e.target, v = kbConv(el.value); if (v !== el.value) el.value = v; kbUpdate() });
$('#kbRows').addEventListener('click', e => {
  const code = e.target.closest('[data-kb]')?.dataset.kb; if (!code) return;
  const el = $('#kbIn');
  if (code === 'Shift') { kbShift = !kbShift; return kbUpdate() }
  if (code === 'Backspace') {
    const a = el.selectionStart ?? el.value.length, b = el.selectionEnd ?? a;
    el.setRangeText('', a === b ? Math.max(0, a - 1) : a, b, 'end'); kbFlash(code); return kbUpdate();
  }
  const k = KB.find(k => k.code === code);
  kbType(code === 'Space' ? ' ' : kbShift ? k.shift : k.base); kbFlash(code);
  if (kbShift) { kbShift = false; kbUpdate() }
});
$('#kbEx').addEventListener('click', e => {
  const w = e.target.closest('[data-kbex]')?.dataset.kbex; if (!w) return;
  $('#kbIn').value = w; kbUpdate(); kbPlay();
});
$('#kbPlay').onclick = kbPlay;
$('#kbClear').onclick = () => { clearTimeout(kbTimer); $('#kbIn').value = ''; kbUpdate() };

  renderText(); renderSounds(); renderTones(); renderPoster(); renderAlphabet(); renderPhrases();
  renderNum(); renderBody(); renderVerbs(); renderQues(); renderCls(); renderFood(); renderSent(); renderTopVerbs(); renderHero(); renderPools();
  renderAns(); renderDlg(); renderEtq(); renderSigns(); lRender(); spRender(); renderMore(); kbRender();

const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target) } }), { threshold: .08 });
$$('.reveal').forEach(el => io.observe(el));

deck = shuffle(items().map((_, i) => i));

lNext(false);

const audioIO = new IntersectionObserver(es => es.forEach(e => {
  if (!e.isIntersecting) return;
  audioIO.unobserve(e.target);
  (window.requestIdleCallback || setTimeout)(() => e.target.querySelectorAll('[data-say]:not([data-say=""])').forEach(b => preloadIdle(b.dataset.say, b.dataset.voice)));
}), { rootMargin: '300px' });
$$('main > section').forEach(sec => audioIO.observe(sec));
// first screen right away: the phrase of the day now, the rest of its list in the background
preload(say(HERO[heroI]));
HERO.forEach(x => preloadIdle(say(x)));
