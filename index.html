/* ================= KEYBOARD ================= */
// Kedmanee, the standard Thai layout. Rows: Latin key labels, then one layer per modifier:
// plain, Shift, AltGr, AltGr+Shift. A layer is a string (one character per key) or an array ('' = nothing).
const KB_EX = ['สวัสดี', 'ขอบคุณ', 'ครับ', 'น้ำ', 'ไม่เป็นไร'];
const KB_SETS = [{
  name: ['Kedmanee', 'Kedmanee'], ph: 'kbPh', note: 'kbNote', ex: KB_EX,
  rows: [
    ['`1234567890-=\\', '_ๅ/-ภถุึคตจขชฃ', '%+๑๒๓๔ู฿๕๖๗๘๙ฅ'],
    ['qwertyuiop[]', 'ๆไำพะัีรนยบล', '๐"ฎฑธํ๊ณฯญฐ,'],
    ["asdfghjkl;'", 'ฟหกดเ้่าสวง', 'ฤฆฏโฌ็๋ษศซ.'],
    ['zxcvbnm,./', 'ผปแอิืทมใฝ', '()ฉฮฺ์?ฒฬฦ'],
  ],
  hint: {},                 // accent label per Latin key, shown instead of the Shift layer
  conv: s => s,             // typed text -> shown text
  keys: ch => [ch],         // shown character -> outputs of the keys that type it
  read: null,               // shown character -> reading under it in the key order
  say: v => v,              // text for the play button ('' hides it)
  out: () => '',            // extra result under the field
}];
const KB_CODE = { '`': 'Backquote', '-': 'Minus', '=': 'Equal', '[': 'BracketLeft', ']': 'BracketRight', '\\': 'Backslash', ';': 'Semicolon', "'": 'Quote', ',': 'Comma', '.': 'Period', '/': 'Slash' };
const KB_MOD = ['', '⇧ ', 'AltGr ', 'AltGr ⇧ '];
const esc = v => String(v).replace(/[&<>"]/g, c => `&#${c.charCodeAt(0)};`);
const kbShow = ch => /\p{M}/u.test(ch) ? '◌' + ch : ch;
let kbSet = 0, KB = [], KB_FIND = new Map(), kbLayers = 2, kbMod = 0, kbHeld = 0, kbDrawn = 0, kbTimer;
const kbS = () => KB_SETS[kbSet];
function kbBuild() {
  const S = kbS();
  KB = S.rows.flatMap(([lat, ...layers], r) => {
    const L = layers.map(l => typeof l === 'string' ? [...l] : l);
    return [...lat].map((l, i) => ({ r, l, code: KB_CODE[l] || (/\d/.test(l) ? 'Digit' + l : 'Key' + l.toUpperCase()), out: L.map(x => x[i] || '') }));
  });
  kbLayers = Math.max(...S.rows.map(r => r.length - 1));
  KB_FIND = new Map();   // output -> [key, layer]; the plainest layer wins
  for (let m = kbLayers - 1; m >= 0; m--) KB.forEach(k => k.out[m] && KB_FIND.set(k.out[m], [k, m]));
}
// one entry per shown character, with the keys that type it: [{ code, l, m }] (null = no key)
const kbSeq = v => [...v].map(ch => ({ ch, keys: ch === ' ' ? [{ code: 'Space', l: 'Space', m: 0 }] : kbS().keys(ch).map(c => KB_FIND.has(c) ? { code: KB_FIND.get(c)[0].code, l: KB_FIND.get(c)[0].l, m: KB_FIND.get(c)[1] } : null) }));
// every key is one unit wide and rows are centred: the rows step in like a trapezoid
const kbW = n => `flex:0 0 calc((100% - ${(kbCols() - 1) * .375}rem) * ${n} / ${kbCols()} + ${(n - 1) * .375}rem)`;
const kbCols = () => Math.max(...kbS().rows.map(r => [...r[0]].length));
const kbBtn = (code, inner, n = 1) => `<button type="button" data-kb="${code}" class="kb-key" style="${kbW(n)}">${inner}</button>`;
const kbCap = (s, cls) => s ? `<span class="${cls}">${esc(kbShow(s))}</span>` : '';
// key face for the active modifier layer m: that layer goes to the centre, the plain one takes its corner
const KB_POS = ['font-thai text-xl', 'absolute right-1.5 top-1 text-xs font-thai', 'absolute right-1.5 bottom-1 text-xs font-thai', 'absolute left-1.5 bottom-1 text-xs font-thai'];
function kbFace(k, m) {
  const S = kbS(), at = l => l === m ? 0 : l === 0 ? m : l;
  return `<span class="absolute left-1.5 top-1 font-mono text-[10px] uppercase text-zinc-500">${esc(k.l)}</span>` + k.out.map((o, l) => {
    const p = at(l);
    if (p === 1 && S.hint[k.l]) return `<span class="${KB_POS[1]} font-semibold text-accent">${esc(S.hint[k.l])}</span>`;
    return kbCap(o, `${KB_POS[p]} ${p ? 'text-zinc-500' : m ? 'text-accent' : 'text-white'}`);
  }).join('');
}
// redraw key faces when the visible layer changes (on-screen Shift/AltGr or held physical modifiers)
function kbFaces() {
  const m = (kbMod | kbHeld) & (kbLayers > 2 ? 3 : 1);
  if (m === kbDrawn) return;
  kbDrawn = m;
  KB.forEach(k => { const b = $(`[data-kb="${k.code}"]`); if (b) b.innerHTML = kbFace(k, m) });
}
function kbRender() {
  kbBuild();
  const S = kbS(), on = 'bg-white text-ink-950', off = 'text-zinc-400 hover:text-white';
  $('#kbTabs').innerHTML = KB_SETS.length < 2 ? '' : `<div class="inline-flex rounded-lg border border-white/10 p-0.5 text-sm font-semibold">${KB_SETS.map((x, i) => `<button type="button" data-kbset="${i}" class="px-3 py-1.5 rounded-md transition ${i === kbSet ? on : off}">${esc(L(...x.name))}</button>`).join('')}</div>`;
  $('#kbIn').placeholder = t(S.ph);
  $('#kbRows').classList.toggle('kb-tall', kbLayers > 2);
  $('#kbNote').innerHTML = t(S.note);
  kbDrawn = 0;
  $('#kbRows').innerHTML = S.rows.map((_, r) => `<div class="flex justify-center gap-1.5">${KB.filter(k => k.r === r).map(k => kbBtn(k.code, kbFace(k, 0))).join('')}</div>`).join('') + `
    <div class="flex justify-center gap-1.5">${kbBtn('Shift', '<span class="text-xs text-zinc-300">⇧ Shift</span>', 2)}${kbLayers > 2 ? kbBtn('AltGr', '<span class="text-xs text-zinc-300">AltGr</span>', 2) : ''}${kbBtn('Space', '<span class="text-xs text-zinc-500">Space</span>', kbLayers > 2 ? 5 : 7)}${kbBtn('Backspace', '<span class="text-xs text-zinc-300">⌫</span>', 2)}</div>`;
  $('#kbEx').innerHTML = S.ex.map(w => `<button type="button" data-kbex="${esc(w)}" class="rounded-lg border border-white/10 px-3 py-1.5 font-thai text-white hover:border-accent/60 transition">${esc(w)}</button>`).join('');
  kbUpdate();
}
function kbUpdate() {
  const S = kbS(), v = $('#kbIn').value, seq = kbSeq(v), keys = seq.flatMap(x => x.keys).filter(Boolean);
  $$('.kb-key').forEach(b => b.classList.toggle('kb-used', keys.some(k => k.code === b.dataset.kb || (b.dataset.kb === 'Shift' && k.m & 1) || (b.dataset.kb === 'AltGr' && k.m & 2))));
  $('[data-kb="Shift"]').classList.toggle('kb-shift-on', !!(kbMod & 1));
  $('[data-kb="AltGr"]')?.classList.toggle('kb-shift-on', !!(kbMod & 2));
  kbFaces();
  $('#kbSeq').innerHTML = seq.length ? seq.map((x, i) => `<span data-kbi="${i}" class="inline-flex flex-col items-center min-w-[44px] rounded-lg border border-white/10 bg-ink-950 px-2 py-1">
    <span class="font-thai text-lg leading-tight text-white">${x.ch === ' ' ? '␣' : esc(kbShow(x.ch))}</span>
    ${S.read?.(x.ch) ? `<span class="font-mono text-[11px] text-accent">${esc(S.read(x.ch))}</span>` : ''}
    <span class="font-mono text-[11px] text-zinc-500">${x.keys.map(k => k ? KB_MOD[k.m] + esc(k.l.length > 1 ? k.l : k.l.toUpperCase()) : '?').join(' ')}</span></span>`).join('') : `<span class="self-center text-sm text-zinc-500">${t('kbEmpty')}</span>`;
  const say = v.trim() && S.say(v.trim());
  $('#kbSay').dataset.say = say || ''; $('#kbSay').classList.toggle('invisible', !say);
  $('#kbOut').innerHTML = S.out(v.trim());
}
function kbType(ch) {
  if (!ch) return;
  const el = $('#kbIn');
  el.setRangeText(ch, el.selectionStart ?? el.value.length, el.selectionEnd ?? el.value.length, 'end');
  const v = kbS().conv(el.value); if (v !== el.value) el.value = v;
  kbUpdate();
}
function kbFlash(code) {
  const b = $(`[data-kb="${code}"]`); if (!b) return;
  b.classList.add('kb-on'); setTimeout(() => b.classList.remove('kb-on'), 160);
}
function kbPlay() {
  clearTimeout(kbTimer);
  const steps = kbSeq($('#kbIn').value).flatMap((x, i) => x.keys.map(k => ({ i, k })));
  const off = () => $$('.kb-on').forEach(b => b.classList.remove('kb-on'));
  const step = i => {
    off();
    if (i >= steps.length) return;
    const { i: ci, k } = steps[i];
    $(`[data-kbi="${ci}"]`)?.classList.add('kb-on');
    if (k) $(`[data-kb="${k.code}"]`)?.classList.add('kb-on');
    if (k?.m & 1) $('[data-kb="Shift"]').classList.add('kb-on');
    if (k?.m & 2) $('[data-kb="AltGr"]')?.classList.add('kb-on');
    kbTimer = setTimeout(() => { off(); kbTimer = setTimeout(() => step(i + 1), 120) }, 520);
  };
  step(0);
}
const kbHold = e => {
  const h = (e.shiftKey ? 1 : 0) + (e.getModifierState?.('AltGraph') || (e.altKey && kbLayers > 2) ? 2 : 0);
  if (h !== kbHeld) { kbHeld = h; kbFaces() }
};
$('#kbIn').addEventListener('keyup', kbHold);
$('#kbIn').addEventListener('blur', () => { kbHeld = 0; kbFaces() });
$('#kbIn').addEventListener('keydown', e => {
  kbHold(e);
  const alt = e.getModifierState?.('AltGraph') || (e.altKey && kbLayers > 2);
  if ((e.ctrlKey && !alt) || e.metaKey || (e.altKey && !alt) || e.isComposing) return;
  const k = KB.find(k => k.code === e.code); if (!k) return;
  e.preventDefault(); kbType(k.out[(alt ? 2 : 0) + (e.shiftKey ? 1 : 0)]); kbFlash(k.code);
});
$('#kbIn').addEventListener('input', e => { const el = e.target, v = kbS().conv(el.value); if (v !== el.value) el.value = v; kbUpdate() });
$('#kbRows').addEventListener('click', e => {
  const code = e.target.closest('[data-kb]')?.dataset.kb; if (!code) return;
  const el = $('#kbIn');
  if (code === 'Shift' || code === 'AltGr') { kbMod ^= code === 'Shift' ? 1 : 2; return kbUpdate() }
  if (code === 'Backspace') {
    const a = el.selectionStart ?? el.value.length, b = el.selectionEnd ?? a;
    const cut = a === b ? (a && /[\uDC00-\uDFFF]/.test(el.value[a - 1]) ? 2 : 1) : 0;
    el.setRangeText('', Math.max(0, a - cut), b, 'end'); kbFlash(code); return kbUpdate();
  }
  const k = KB.find(k => k.code === code);
  kbType(code === 'Space' ? ' ' : k.out[kbMod]); kbFlash(code);
  if (kbMod) { kbMod = 0; kbUpdate() }
});
$('#kbEx').addEventListener('click', e => {
  const w = e.target.closest('[data-kbex]')?.dataset.kbex; if (!w) return;
  $('#kbIn').value = w; kbUpdate(); kbPlay();
});
$('#kbTabs').addEventListener('click', e => {
  const i = e.target.closest('[data-kbset]')?.dataset.kbset; if (i == null) return;
  kbSet = +i; kbMod = 0; clearTimeout(kbTimer); $('#kbIn').value = ''; kbRender(); icons();
});
$('#kbPlay').onclick = kbPlay;
$('#kbClear').onclick = () => { clearTimeout(kbTimer); $('#kbIn').value = ''; kbUpdate() };

}

/* ================= OFFLINE ================= */
// sw.js keeps the whole site (page, audio, libraries, fonts) for use without internet and, when online,
// downloads only what changed (offline.json, written by tools/offline.py on every commit)
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  const OFF = {
    ru: ['Сохраняем сайт для работы без интернета: {p}%', 'Сайт сохранён — работает и без интернета', 'Нет сети — открыта сохранённая версия'],
    en: ['Saving the site for offline use: {p}%', 'Saved — the site works without internet too', 'Offline — showing the saved version'],
    th: ['กำลังบันทึกเว็บไว้ใช้แบบออฟไลน์: {p}%', 'บันทึกแล้ว ใช้งานได้แม้ไม่มีอินเทอร์เน็ต', 'ไม่มีอินเทอร์เน็ต กำลังแสดงเวอร์ชันที่บันทึกไว้'],
  };
  const offSay = (i, p) => { const el = document.getElementById('offlineState'); if (el) el.textContent = (OFF[document.documentElement.lang] || OFF.en)[i].replace('{p}', p) };
  navigator.serviceWorker.addEventListener('message', e => {
    const d = e.data; if (!d || d.type !== 'offline') return;
    if (d.offline) offSay(2); else if (d.done < d.total) offSay(0, Math.floor(d.done / d.total * 100)); else offSay(1);
  });
  addEventListener('offline', () => offSay(2));
  addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').then(() => navigator.serviceWorker.ready)
      .then(r => r.active && r.active.postMessage({ type: 'sync', full: !(navigator.connection && navigator.connection.saveData) }))
      .catch(() => {});
  });
}
